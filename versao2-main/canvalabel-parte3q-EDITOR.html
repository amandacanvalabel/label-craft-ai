      <input class="pinp" data-fn="code" value="${el.code||''}" maxlength="13"></div>
      ${fColor('Cor das barras', el.fg, 'fg')}</div>`;
  }
  if(el.type==='qr'){
    h += `<div class="pgroup">
      <div class="pgroup-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>QR Code</div>
      <div class="pfield"><label>Conteúdo (link)</label>
      <input class="pinp" data-fn="seed" value="${el.seed||''}" placeholder="https://..."></div>
      ${fColor('Cor', el.fg, 'fg')}</div>`;
  }
  if(el.type==='shape'){
    const shapeName = SHAPE_LIB[el.shapeKind]?.name || 'Forma';
    h += `<div class="pgroup">
      <div class="pgroup-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,3 21,21 3,21"/></svg>Forma — ${shapeName}</div>
      <div class="act-row" style="margin-bottom:11px">
        <button class="act-dup" id="changeShape">Trocar forma</button>
      </div>
      ${fColor('Preenchimento', el.fill, 'fill')}
      <div class="swatches">${PALETTE.map(c=>`<div class="swatch" style="background:${c}" data-swatch="fill|${c}"></div>`).join('')}</div>
      ${fColor('Borda', el.stroke, 'stroke')}
      <div class="prow" style="margin-top:9px">${fNum('Espessura borda', el.sw, 'mm', 0.2)}<div class="pfield"></div></div>
    </div>`;
  }
  if(el.type==='textCurve'){
    const curves = [
      {id:'arcUp', name:'Arco superior'},
      {id:'arcDown', name:'Arco inferior'},
      {id:'circle', name:'Círculo'},
      {id:'wave', name:'Onda'},
      {id:'zigzag', name:'Zigue-zague'},
    ];
    h += `<div class="pgroup">
      <div class="pgroup-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c0-7 6-12 9-12s9 5 9 12"/></svg>Texto em curva</div>

      <div class="pfield"><label>Conteúdo</label>
        <input class="pinp" data-fn="text" value="${(el.text||'').replace(/"/g,'&quot;')}"></div>

      <div class="pfield" style="margin-top:9px"><label>Curva</label>
        <div class="curve-grid">
          ${curves.map(c=>`<button class="curve-opt ${el.curve===c.id?'on':''}" data-curve="${c.id}">
            <svg viewBox="0 0 60 30" width="50" height="22">
              ${renderCurvePreview(c.id)}
            </svg>
            <span>${c.name}</span>
          </button>`).join('')}
        </div>
      </div>

      <div class="prow" style="margin-top:11px">
        <div class="pfield"><label>Intensidade da curva</label>
          <div class="slider-row"><input type="range" min="0" max="100" step="5" value="${el.radius||50}" data-range="radius"><span class="sval">${el.radius||50}</span></div>
        </div>
      </div>

      <div class="prow" style="margin-top:9px">
        <div class="pfield" style="flex:0 0 auto"><label>Inverter</label>
          <div class="seg"><button data-toggle="flip" class="${el.flip?'on':''}">↻</button></div>
        </div>
        <div class="pfield" style="flex:1"><label>Posição do texto</label>
          <div class="slider-row"><input type="range" min="0" max="100" step="5" value="${parseInt(el.startOffset)||50}" data-range="startOffset"><span class="sval">${parseInt(el.startOffset)||50}%</span></div>
        </div>
      </div>

      <div class="prow" style="margin-top:11px"><div class="pfield"><label>Fonte</label>
        <button class="pinp font-picker-btn" data-open-font-picker style="text-align:left;font-family:'${el.font}';display:flex;align-items:center;justify-content:space-between;cursor:pointer">
          <span>${el.font}</span>
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button></div></div>
      <div class="prow" style="margin-top:8px">${fNum('Tamanho',el.size,'pt',0.5)}
        <div class="pfield"><label>Peso</label>
        <select class="pinp" data-fn="weight">${[300,400,500,600,700,800].map(w=>`<option value="${w}" ${w==el.weight?'selected':''}>${w}</option>`).join('')}</select></div></div>
      <div class="prow" style="margin-top:8px"><div class="pfield"><label>Espaçamento</label>
        <div class="slider-row"><input type="range" min="-2" max="20" step="0.5" value="${el.ls||0}" data-range="ls"><span class="sval">${el.ls||0}</span></div></div></div>
      ${fColor('Cor', el.color, 'color')}
      <div class="swatches">${PALETTE.map(c=>`<div class="swatch" style="background:${c}" data-swatch="color|${c}"></div>`).join('')}</div>
    </div>`;
  }

  // Posição / tamanho — todos
  h += `<div class="pgroup">
    <div class="pgroup-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M3 8V5a2 2 0 0 1 2-2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>Posição e tamanho</div>
    <div class="prow">${fNum('X', Math.round(el.x*10)/10, 'mm', 0.5)}${fNum('Y', Math.round(el.y*10)/10, 'mm', 0.5)}</div>
    <div class="prow">${fNum('Largura', Math.round(el.w*10)/10, 'mm', 0.5)}${fNum('Altura', Math.round(el.h*10)/10, 'mm', 0.5)}</div>
    <div class="prow">
      ${fNum('Rotação', el.rot, '°', 1)}
      <div class="pfield"><label>Opacidade</label>
      <div class="slider-row"><input type="range" min="0" max="100" step="1" value="${el.opacity}" data-range="opacity"><span class="sval">${el.opacity}%</span></div></div>
    </div></div>`;

  // Nome da camada
  h += `<div class="pgroup">
    <div class="pgroup-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>Nome da camada</div>
    <div class="pfield"><input class="pinp" data-fn="name" value="${(el.name||'').replace(/"/g,'&quot;')}"></div>
    <div style="font-size:10.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5">Esse nome aparece no painel de camadas e será usado depois para escolher acabamentos (verniz, hot stamping, baixo relevo).</div></div>`;

  // Acabamentos do elemento
  h += renderFinishesSection(el);

  // Ações
  h += `<div class="pgroup"><div class="act-row">
    <button class="act-dup" id="dupEl">Duplicar</button>
    <button class="act-del" id="delEl">Excluir</button>
  </div></div></div>`;

  p.innerHTML = h;

  // Bind dos checkboxes e cores de hot stamping
  bindFinishesUI(p, el);

  // Font picker (abre modal com 150 fontes categorizadas)
  const fpBtn = p.querySelector('[data-open-font-picker]');
  if(fpBtn){
    fpBtn.onclick = ()=>openFontPicker(el.font, (newFont)=>{
      el.font = newFont;
      ensureFontLoaded(newFont);
      edPush();
      edRender();
    });
  }

  // bindings
  p.querySelectorAll('[data-fn]').forEach(inp=>{
    inp[inp.tagName==='SELECT'?'onchange':'onchange'] = ()=>{
      const k = inp.dataset.fn;
      let v = inp.value;
      const labels = {'X':'x','Y':'y','Largura':'w','Altura':'h',
        'Tamanho':'size','Rotação':'rot','Espessura':'sw','Cantos':'radius'};
      if(k==='font') el.font = v;
      else if(k==='weight') el.weight = +v;
      else if(k==='text') el.text = v;
      else if(k==='name') el.name = v;
      else if(k==='code') el.code = v;
      else if(k==='seed') el.seed = v;
      else if(labels[k]){
        v = parseFloat(v)||0;
        const key = labels[k];
        if(key==='w'||key==='h') v = Math.max(el.type==='line'&&key==='h'?0.1:5, v);
        el[key] = v;
      }
      edPush(); edRender();
    };
  });
  p.querySelectorAll('.seg[data-seg] button').forEach(b=>{
    b.onclick = ()=>{ el.align = b.dataset.v; edPush(); edRender(); };
  });
  p.querySelectorAll('[data-toggle]').forEach(b=>{
    b.onclick = ()=>{ el[b.dataset.toggle] = !el[b.dataset.toggle]; edPush(); edRender(); };
  });
  p.querySelectorAll('input[data-range]').forEach(r=>{
    const lbl = r.parentElement.querySelector('.sval');
    r.oninput = ()=>{ const k=r.dataset.range, v=parseFloat(r.value);
      el[k] = v;
      lbl.textContent = k==='lh'?v.toFixed(2):(k==='opacity'?v+'%':v);
      edRenderElements(); edRenderOverlay(); };
    r.onchange = ()=>edPush();
  });
  bindColor(p, (k,v)=>{ el[k] = v; edPush(); edRender(); });
  p.querySelectorAll('[data-swatch]').forEach(s=>{
    s.onclick = ()=>{ const [k,c] = s.dataset.swatch.split('|');
      el[k] = c; edPush(); edRender(); };
  });
  const dup = p.querySelector('#dupEl'); if(dup) dup.onclick = ()=>edDuplicate(el);
  const del = p.querySelector('#delEl'); if(del) del.onclick = ()=>edDelete(el);
  const rep = p.querySelector('#replaceImg');
  if(rep) rep.onclick = ()=>pickFile(d=>{ el.src = d; edPush(); edRender(); });
  // Shape — trocar forma abre o gallery em modo "trocar"
  const cs = p.querySelector('#changeShape');
  if(cs) cs.onclick = ()=>openShapeGalleryFor(el);
  // TextCurve — botões de curva
  p.querySelectorAll('[data-curve]').forEach(b=>{
    b.onclick = ()=>{
      p.querySelectorAll('[data-curve]').forEach(x=>x.classList.toggle('on', x===b));
      el.curve = b.dataset.curve;
      edPush(); edRender();
    };
  });
  // adicionar atualização de ícones de camada
  if(el.type==='textCurve' || el.type==='shape' || el.type==='selo'){
    // recarrega visualmente
  }
}

/* Abre a galeria para TROCAR a forma de um elemento existente */
function openShapeGalleryFor(el){
  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  document.body.appendChild(overlay);
  const cats = getShapesByCategory();
  let searchQuery = '';

  function render(){
    const q = searchQuery.trim().toLowerCase();
    let sections = [];
    Object.entries(cats).forEach(([catName, items])=>{
      const filtered = q ? items.filter(i => i.name.toLowerCase().includes(q)) : items;
      if(filtered.length) sections.push({ name:catName, items:filtered });
    });
    overlay.innerHTML = `<div class="modal" style="width:780px;max-width:94vw;max-height:84vh">
      <div class="modal-head"><h3>Trocar <span style="color:var(--accent)">forma</span></h3>
        <button class="x" id="sg2Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div style="padding:14px 24px 0"><div style="position:relative">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="sg2Search" type="text" placeholder="Buscar forma..." value="${searchQuery.replace(/"/g,'&quot;')}" style="width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px 11px 40px;font-family:inherit;font-size:13px;color:var(--ink);outline:none"></div></div>
      <div class="modal-body" style="padding:6px 8px 12px">
        ${sections.map(s=>`<div class="fp-section"><div class="fp-section-h">${s.name}</div><div class="sg-grid">
          ${s.items.map(it=>`<button class="sg-shape ${el.shapeKind===it.key?'sel':''}" data-shape="${it.key}" title="${it.name}">
            <svg viewBox="0 0 100 100" width="48" height="48"><path d="${SHAPE_LIB[it.key].path}" fill="currentColor"/></svg>
            <span>${it.name}</span></button>`).join('')}
        </div></div>`).join('')}
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" id="sg2Cancel">Fechar</button></div></div>`;
    overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
    $('#sg2Close').onclick = close;
    $('#sg2Cancel').onclick = close;
    $('#sg2Search').oninput = e=>{ searchQuery = e.target.value; render(); $('#sg2Search').focus(); };
    $$('[data-shape]').forEach(b=>b.onclick = ()=>{
      el.shapeKind = b.dataset.shape;
      el.name = SHAPE_LIB[b.dataset.shape].name;
      edPush(); edRender(); close();
    });
  }
  function close(){ overlay.remove(); }
  render();
  setTimeout(()=>{ const s = $('#sg2Search'); if(s) s.focus(); }, 50);
}

/* ---------- Painel de camadas ---------- */
const LAYER_ICONS = {
  text:'<path d="M4 7V4h16v3"/><path d="M9 20h6M12 4v16"/>',
  textCurve:'<path d="M3 17 Q 12 4, 21 17"/>',
  rect:'<rect x="3" y="6" width="18" height="12" rx="2"/>',
  ellipse:'<circle cx="12" cy="12" r="9"/>',
  line:'<line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="19" cy="5" r="1.5" fill="currentColor"/>',
  shape:'<path d="M12 3L21 20H3z"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21"/>',
  selo:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5L15.5 10" stroke-linecap="round" stroke-linejoin="round"/>',
  barcode:'<path d="M4 5v14M7 5v14M10 5v14M14 5v14M17 5v14M20 5v14" stroke-width="1.7"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="0.5"/><rect x="14" y="3" width="7" height="7" rx="0.5"/><rect x="3" y="14" width="7" height="7" rx="0.5"/>',
};
function edRenderLayers(){
  const list = $('#layerList');
  if(!curEls().length){
    list.innerHTML = `<div class="ed-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2L2 7l10 5 10-5z"/></svg>
      <div>Nenhuma camada nesta face.</div></div>`;
    edSetLayerTools(); return;
  }
  list.innerHTML = '';
  const selectedIds = new Set(selIds());
  [...curEls()].reverse().forEach(el=>{
    const row = document.createElement('div');
    row.className = 'layer' + (selectedIds.has(el.id)?' sel':'') + (el.visible?'':' hidden');
    row.dataset.id = el.id;
    row.innerHTML = `
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LAYER_ICONS[el.type]||''}</svg></div>
      <div class="name"><span>${el.name}</span></div>
      <button class="lbtn" data-act="lock">${el.locked
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>'}</button>
      <button class="lbtn" data-act="vis">${el.visible
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 5A9.5 9.5 0 0 1 12 5c6 0 10 7 10 7a16 16 0 0 1-3 3.5M6 6.5C3.3 8.3 2 12 2 12s4 7 10 7a9.5 9.5 0 0 0 5-1.4M3 3l18 18"/></svg>'}</button>`;
    const selectLayer = (ev)=>{
      if(ev.shiftKey){ edSelectToggle(el.id); edRender(); }
      else edSelect(el.id);
    };
    row.querySelector('.name').onclick = selectLayer;
    row.querySelector('.ico').onclick = selectLayer;
    row.querySelector('.name').ondblclick = ()=>edRenameLayer(row, el);
    row.querySelector('[data-act=vis]').onclick = e=>{
      e.stopPropagation(); el.visible = !el.visible; edPush(); edRender(); };
    row.querySelector('[data-act=lock]').onclick = e=>{
      e.stopPropagation(); el.locked = !el.locked; edPush(); edRender(); };
    list.appendChild(row);
  });
  edSetLayerTools();
}
function edRenameLayer(row, el){
  const span = row.querySelector('.name');
  span.innerHTML = `<input value="${(el.name||'').replace(/"/g,'&quot;')}">`;
  const inp = span.querySelector('input'); inp.focus(); inp.select();
  const done = ()=>{ el.name = inp.value.trim() || el.name; edPush(); edRender(); };
  inp.onblur = done;
  inp.onkeydown = e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape') edRender(); };
}
function edSetLayerTools(){
  const el = elById(E().sel), has = !!el;
  const i = el ? curEls().indexOf(el) : -1;
  $('#lyrUp').disabled   = !has || i>=curEls().length-1;
  $('#lyrDown').disabled = !has || i<=0;
  $('#lyrDup').disabled  = !has;
  $('#lyrDel').disabled  = !has;
}
function edLayerUp(){
  const el = elById(E().sel); if(!el) return;
  const arr = curEls(), i = arr.indexOf(el);
  if(i<arr.length-1){ arr.splice(i,1); arr.splice(i+1,0,el); edPush(); edRender(); }
}
function edLayerDown(){
  const el = elById(E().sel); if(!el) return;
  const arr = curEls(), i = arr.indexOf(el);
  if(i>0){ arr.splice(i,1); arr.splice(i-1,0,el); edPush(); edRender(); }
}

/* ---------- Teclado ---------- */
function edKey(e){
  if(!document.body.classList.contains('editor-mode')) return;
  const editing = document.querySelector('.el-text.editing') ||
    ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  // Ctrl+S funciona mesmo em inputs (comportamento padrão de "salvar")
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
    e.preventDefault();
    const r = saveProject();
    if(r.ok) toast(`Projeto "${r.name}" salvo`);
    else toast('Falha ao salvar');
    return;
  }
  if(editing) return;
  // Ctrl+A — selecionar tudo
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){
    e.preventDefault(); edSelectAll(); return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); edUndo(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){
    e.preventDefault(); edRedo(); return; }

  const sels = selEls();

  // Ctrl+D — duplicar (suporta multi)
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && sels.length){
    e.preventDefault();
    if(sels.length === 1) edDuplicate(sels[0]);
    else {
      const newIds = [];
      sels.forEach(el=>{
        const c = JSON.parse(JSON.stringify(el));
        c.id = 'e' + (E().uid++);
        c.x += 4; c.y += 4;
        c.name = el.name + ' (cópia)';
        curEls().push(c);
        newIds.push(c.id);
      });
      E().selSet = new Set(newIds);
      E().sel = newIds[newIds.length-1];
      edPush(); edRender();
    }
    return;
  }

  if(!sels.length) return;

  // Delete / Backspace — remove todos selecionados
  if(e.key==='Delete' || e.key==='Backspace'){
    e.preventDefault();
    if(sels.length === 1){ edDelete(sels[0]); return; }
    const ids = new Set(sels.map(s=>s.id));
    E().faces[E().face] = curEls().filter(el => !ids.has(el.id));
    edClearSelection();
    edPush(); edRender();
    toast(`${ids.size} itens excluídos`);
    return;
  }
  if(e.key==='Escape'){ edSelect(null); return; }

  const step = e.shiftKey ? 5 : 0.5;
  if(e.key==='ArrowLeft'){ e.preventDefault(); sels.forEach(el => el.x -= step); edPush(); edRender(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); sels.forEach(el => el.x += step); edPush(); edRender(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); sels.forEach(el => el.y -= step); edPush(); edRender(); }
  if(e.key==='ArrowDown'){ e.preventDefault(); sels.forEach(el => el.y += step); edPush(); edRender(); }
}
