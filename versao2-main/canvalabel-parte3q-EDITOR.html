  }
  if(family === 'vinil'){
    if(variant === 'branco' && !subvariant) return '<rect width="100" height="100" fill="#fafaf7"/><rect x="20" y="25" width="60" height="50" rx="5" fill="#fff" stroke="#cbc4ba" stroke-width="2.2"/>';
    if(variant === 'holografico') return '<defs><linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb8d8"/><stop offset="0.33" stop-color="#bce6ff"/><stop offset="0.66" stop-color="#d4ffbf"/><stop offset="1" stop-color="#ffd9a8"/></linearGradient></defs><rect width="100" height="100" fill="#f0eee9"/><rect x="20" y="25" width="60" height="50" rx="5" fill="url(#holo)" stroke="#bfb6a6" stroke-width="2"/>';
    if(variant === 'transparente' && !subvariant) return '<defs><pattern id="vtrans" patternUnits="userSpaceOnUse" width="12" height="12"><rect width="6" height="6" fill="#ebebeb"/><rect x="6" y="6" width="6" height="6" fill="#ebebeb"/></pattern></defs><rect width="100" height="100" fill="#f5f3ee"/><rect x="20" y="25" width="60" height="50" rx="5" fill="url(#vtrans)" stroke="#bfb6a6" stroke-width="2"/>';
  }
  if(family === 'couche'){
    if(variant === 'brilho') return '<defs><linearGradient id="cbr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#f5f4ef"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="100" height="100" fill="#fcfaf6"/><rect x="20" y="25" width="60" height="50" fill="url(#cbr)" stroke="#d4cdbf" stroke-width="1"/><rect x="22" y="27" width="56" height="2" fill="#fff" opacity="0.9"/>';
    if(variant === 'fosco') return '<rect width="100" height="100" fill="#fcfaf6"/><rect x="20" y="25" width="60" height="50" fill="#f7f4ec" stroke="#cdc6b9" stroke-width="1"/>';
  }
  if(family === 'gofrado'){
    if(variant === 'andes') return '<defs><pattern id="andes" patternUnits="userSpaceOnUse" width="100" height="3"><line x1="0" y1="1" x2="100" y2="1" stroke="#cbc4ba" stroke-width="0.4"/></pattern></defs><rect width="100" height="100" fill="#f4ede0"/><rect x="20" y="25" width="60" height="50" fill="url(#andes)" stroke="#a89e8a" stroke-width="1.2"/>';
    if(variant === 'vergeMartele') return '<defs><pattern id="verge" patternUnits="userSpaceOnUse" width="5" height="5"><circle cx="2.5" cy="2.5" r="1" fill="#bfb6a6"/></pattern></defs><rect width="100" height="100" fill="#f4ede0"/><rect x="20" y="25" width="60" height="50" fill="url(#verge)" stroke="#a89e8a" stroke-width="1.2"/>';
  }

  // Nível 3: subvariantes (BOPP metalizado)
  if(family === 'bopp' && variant === 'metalizado'){
    if(subvariant === 'metal') return '<defs><linearGradient id="mtl2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dadce0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#9298a1"/></linearGradient></defs><rect width="100" height="100" fill="#ede9e1"/><rect x="20" y="25" width="60" height="50" rx="3" fill="url(#mtl2)" stroke="#8e9099" stroke-width="1.5"/>';

  }
  // Vinil branco subvariantes
  if(family === 'vinil' && variant === 'branco'){
    if(subvariant === 'brilho') return '<defs><linearGradient id="vbr" x1="0" y1="0" x2="1" y2="0.5"><stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#f0eee9"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="100" height="100" fill="#fafaf7"/><rect x="20" y="25" width="60" height="50" rx="5" fill="url(#vbr)" stroke="#cbc4ba" stroke-width="2.2"/><path d="M25 30 L35 30 L33 35 L23 35 Z" fill="#fff" opacity="0.6"/>';

  if(family === 'vinil' && variant === 'transparente'){

  }

  return '<rect width="100" height="100" fill="#f0eee9"/>';

/* ============================================================
   RENDER.acabamentos — Etapa 12: acabamentos por camada
============================================================ */
RENDER.acabamentos = () => {
  const M = state.material || {};
  const matStr = M.family ? getMaterialLabel(M) : 'Não escolhido';
  const matComplete = isMaterialComplete(M);

  // Coleta todos os elementos com acabamentos (de todas as faces)
  const finishedItems = []; // [{face, faceLabel, el, finish}]
  Object.entries(state.editor.faces || {}).forEach(([faceId, els])=>{
    const faceLabel = faceId.charAt(0).toUpperCase() + faceId.slice(1);
    els.forEach(el=>{
      const f = getElFinishes(el);
      if(f.verniz || f.hotstamp || f.baixoRelevo){
        finishedItems.push({faceId, faceLabel, el, fin:f});
      }
    });
  });

  // Agrupa por tipo de acabamento
  const byType = {
    hotstamp_silver:  { name:'Hot Stamping Prata', icon:'silver', items:[] },
    hotstamp_gold:    { name:'Hot Stamping Ouro', icon:'gold', items:[] },
    hotstamp_copper:  { name:'Hot Stamping Cobre', icon:'copper', items:[] },
    hotstamp_holografico: { name:'Hot Stamping Holográfico', icon:'holografico', items:[] },
    verniz:           { name:'Verniz Localizado', icon:'verniz', items:[] },
    baixoRelevo:      { name:'Baixo Relevo', icon:'bxr', items:[] },
  };
  finishedItems.forEach(item=>{
    if(item.fin.hotstamp){
      const k = 'hotstamp_' + item.fin.hotstamp;
      if(byType[k]) byType[k].items.push(item);
    }
    if(item.fin.verniz) byType.verniz.items.push(item);
    if(item.fin.baixoRelevo) byType.baixoRelevo.items.push(item);
  });

  // Filtra os tipos que têm itens
  const activeTypes = Object.entries(byType).filter(([_,v])=>v.items.length > 0);

  let html = `<div class="screen">
    <div class="eyebrow">Passo 12 · Produção</div>
    <h1 class="scr">Revisão de <span class="hl">acabamentos</span></h1>
    <p class="scr-sub">Confira os acabamentos especiais aplicados ao seu rótulo. Para alterar, volte ao editor e selecione um elemento — a seção "Acabamentos especiais" aparece no painel direito.</p>

    <div class="ac-material-box">
      <div class="ac-mb-label">Material escolhido</div>
      <div class="ac-mb-name">${matStr}</div>
      ${!matComplete ? '<div class="ac-mb-warn">⚠ Material incompleto — defina antes de exportar.</div>' : ''}
    </div>`;

  if(activeTypes.length === 0){
    html += `<div class="ac-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h0"/></svg>
      <div class="ac-empty-title">Nenhum acabamento especial aplicado</div>
      <div class="ac-empty-sub">Seu rótulo vai ser impresso apenas em <b>CMYK padrão</b> sobre o material escolhido — sem efeitos especiais.<br><br>Para adicionar acabamentos, volte ao editor, selecione um elemento e use a seção <b>"Acabamentos especiais"</b> no painel direito.</div>
      <button class="btn btn-ghost ac-empty-btn" id="acGoEditor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Voltar ao editor
      </button>
    </div>`;
  } else {
    html += `<div class="ac-summary">
      <div class="ac-summ-count">${finishedItems.length}</div>
      <div class="ac-summ-text">${finishedItems.length === 1 ? 'elemento com acabamento especial' : 'elementos com acabamentos especiais'} aplicado${finishedItems.length === 1 ? '' : 's'} em <b>${activeTypes.length}</b> ${activeTypes.length === 1 ? 'técnica' : 'técnicas'}</div>
    </div>`;

    activeTypes.forEach(([key, group])=>{
      html += `<div class="ac-group">
        <div class="ac-group-h">
          <span class="ac-group-swatch fin-sw-${group.icon}"></span>
          <span class="ac-group-name">${group.name}</span>
          <span class="ac-group-count">${group.items.length} ${group.items.length === 1 ? 'elemento' : 'elementos'}</span>
        </div>
        <div class="ac-items">
          ${group.items.map(it=>`
            <button class="ac-item" data-face="${it.faceId}" data-id="${it.el.id}">
              <div class="ac-item-icon">${getElTypeIconSVG(it.el.type)}</div>
              <div class="ac-item-info">
                <div class="ac-item-name">${it.el.name}</div>
                <div class="ac-item-face">${it.faceLabel}</div>
              </div>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          `).join('')}
        </div>
      </div>`;
    });
  }

  html += `<div class="step-nav">
    <button class="btn btn-ghost" id="acBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar ao material
    </button>
    <button class="btn btn-primary" id="acNext">
      Avançar — Exportar PDF
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div></div>`;

  $('#screen').innerHTML = html;

  // Bindings
  $('#acBack').onclick = ()=>go(stepIdx('material'));
  $('#acNext').onclick = ()=>go(stepIdx('exportar'));
  const goEd = $('#acGoEditor');
  if(goEd) goEd.onclick = ()=>go(stepIdx('editor'));

  // Clicar num item leva pro editor com o elemento selecionado
  $$('.ac-item').forEach(b=>b.onclick = ()=>{
    const faceId = b.dataset.face;
    const elId = b.dataset.id;
    // Salva a face e o elemento pra abrir já selecionados
    state.editor.face = faceId;
    state.editor.sel = elId;
    state.editor.selSet = null;
    go(stepIdx('editor'));
  });
};

/* Mini ícone SVG por tipo de elemento (usado na revisão de acabamentos) */

  const ico = LAYER_ICONS[type] || LAYER_ICONS.rect;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ico}</svg>`;
}

/* Agrupa todos os acabamentos aplicados por tipo+cor.
   Retorna [{key, name, swatchKey, items:[{faceId, faceLabel, el}]}] */
function collectFinishGroups(){
  const groups = {
    hotstamp_silver:      { name:'Hot Stamping Prata',      swatchKey:'silver',      items:[] },
    hotstamp_gold:        { name:'Hot Stamping Ouro',       swatchKey:'gold',        items:[] },
    hotstamp_copper:      { name:'Hot Stamping Cobre',      swatchKey:'copper',      items:[] },
    hotstamp_holografico: { name:'Hot Stamping Holográfico',swatchKey:'holografico', items:[] },
    verniz:               { name:'Verniz Localizado',       swatchKey:'verniz',      items:[] },
    baixoRelevo:          { name:'Baixo Relevo',            swatchKey:'bxr',         items:[] },
  };
  Object.entries(state.editor.faces || {}).forEach(([faceId, els])=>{
    const faceLabel = faceId.charAt(0).toUpperCase() + faceId.slice(1);
    els.forEach(el=>{
      const f = getElFinishes(el);
      if(f.hotstamp){
        const k = 'hotstamp_' + f.hotstamp;
        if(groups[k]) groups[k].items.push({faceId, faceLabel, el});
      }
      if(f.verniz)      groups.verniz.items.push({faceId, faceLabel, el});
      if(f.baixoRelevo) groups.baixoRelevo.items.push({faceId, faceLabel, el});
    });
  });
  return Object.entries(groups)
    .filter(([_, g]) => g.items.length > 0)
    .map(([key, g]) => ({key, ...g}));
}

/* Decide o formato da página do PDF com base no tamanho do rótulo.
   Por enquanto: A4 retrato pra tudo que cabe. Se algum lado > 180mm,
   muda pra paisagem ou A3. Função isolada pra facilitar customização futura. */
function pickPageFormat(labelW, labelH){
  const MAX_CONTENT_MM = 180; // largura útil em A4 retrato (210mm - 30mm margens)
  if(labelW > MAX_CONTENT_MM && labelH > MAX_CONTENT_MM){
    return { format:'a3', orientation:'p', label:'A3 retrato (297×420mm)', w:297, h:420 };
  }
  if(labelW > MAX_CONTENT_MM){
    return { format:'a4', orientation:'l', label:'A4 paisagem (297×210mm)', w:297, h:210 };
  }
  return { format:'a4', orientation:'p', label:'A4 retrato (210×297mm)', w:210, h:297 };
}

/* Função principal: gera e baixa o PDF.
   Por enquanto stub — vai ser implementada nas próximas sub-rodadas. */
async function generatePDF(){
  const btn = $('#exGo');
  if(!btn) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="spin"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Gerando PDF...';

  try {
    // Sanity check das libs
    if(typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF){
      throw new Error('jsPDF não carregou. Verifique sua conexão.');
    }
    if(typeof window.html2canvas !== 'function'){
      throw new Error('html2canvas não carregou. Verifique sua conexão.');
    }

    // Determina formato da página
    const labelW = state.editor.label.w;
    const labelH = state.editor.label.h;
    const pageInfo = pickPageFormat(labelW, labelH);

    // Cria PDF
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: pageInfo.orientation,
      unit: 'mm',
      format: pageInfo.format,
      compress: true,
    });

    // Calcula total de páginas pra mostrar progresso
    const faces = Object.keys(state.editor.faces || {});
    const finishGroups = collectFinishGroups();
    const totalPages = 1 /* spec */ + faces.length + finishGroups.length + 1 /* faca */;
    let pageNum = 1;
    const updateProgress = (txt) => {
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="spin"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> ${txt} (${pageNum}/${totalPages})`;
    };

    // === Página 1: Especificação técnica ===
    updateProgress('Capa');
    await buildSpecPage(pdf, pageInfo);
    pageNum++;

    // === Páginas 2+: uma por face do rótulo ===
    for(const faceId of faces){
      pdf.addPage();
      updateProgress(`Rótulo (${faceId})`);
      await buildLabelPage(pdf, pageInfo, faceId, pageNum, totalPages);
      pageNum++;
    }

    // === Páginas seguintes: uma por acabamento aplicado ===
    for(const group of finishGroups){
      pdf.addPage();
      updateProgress(group.name);
      await buildFinishPage(pdf, pageInfo, group, pageNum, totalPages);
      pageNum++;
    }

    // === Última página: faca cotada ===
    pdf.addPage();
    updateProgress('Faca');
    await buildDieCutPage(pdf, pageInfo, pageNum, totalPages);

    // Gera nome do arquivo e baixa
    const docname = (state.editor.docname || 'rotulo').replace(/[^a-z0-9_\-]+/gi, '_').toLowerCase();
    const date = new Date().toISOString().slice(0,10);
    const filename = `canvalabel_${docname}_${date}.pdf`;
    pdf.save(filename);
    toast(`PDF salvo: ${filename}`);

  } catch(e){
    console.error(e);
    toast('Erro: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* ============================================================
   Helpers de PDF: cada função recebe o pdf e o pageInfo, e adiciona
   o conteúdo de uma página. Estratégia: monta HTML temporário fora
   da viewport, renderiza com html2canvas, adiciona ao PDF.
============================================================ */

/* Cria um container DOM fora da viewport para renderizar.
   Retorna o elemento; lembre-se de chamar removeRenderContainer depois. */
function createRenderContainer(widthMm, heightMm){
  // 1mm ≈ 3.7795px em 96dpi. Usamos resolução maior pra qualidade no PDF.
  // Escala 4× = ~378dpi (fica nítido até em zoom 200%).
  const SCALE = 4;
  const pxPerMm = 3.7795275591 * SCALE;
  const container = document.createElement('div');
  container.style.cssText = `
    position:fixed;left:-99999px;top:0;
    width:${widthMm * pxPerMm}px;
    height:${heightMm * pxPerMm}px;
    background:#fff;color:#222;
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  `;
  container.dataset.pxPerMm = pxPerMm;
  container.dataset.scale = SCALE;
  document.body.appendChild(container);
  return container;
}

function removeRenderContainer(container){
  if(container && container.parentNode) container.parentNode.removeChild(container);
}

/* Captura um elemento DOM e adiciona como imagem na página atual do PDF. */
async function captureToPdfPage(pdf, container, pageInfo){
  const canvas = await window.html2canvas(container, {
    scale: 1, // já estamos em alta resolução no container
    backgroundColor: '#ffffff',
    logging: false,
    useCORS: true,
    allowTaint: true,
  });
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  pdf.addImage(imgData, 'JPEG', 0, 0, pageInfo.w, pageInfo.h, undefined, 'FAST');
}

/* Renderiza o rótulo (face atual ou face específica) em HTML estático.
   Usado tanto no preview da página 1 quanto nas páginas individuais por face.
   Retorna um <div> com proporções corretas em mm. */
function renderLabelStatic(faceId, pxPerMm, opts){
  opts = opts || {};
  const L = state.editor.label;
  const els = state.editor.faces[faceId] || [];

  const wrap = document.createElement('div');
  wrap.style.cssText = `
    position:relative;
    width:${L.w * pxPerMm}px;
    height:${L.h * pxPerMm}px;
    background:${L.bg || '#ffffff'};
    overflow:hidden;
    box-shadow:0 0 0 1px #ccc;
  `;

  els.forEach(el=>{
    if(!el.visible && !opts.showAll) return;
    // Em modo isolado (página de acabamento), só mostra elementos com aquele acabamento
    if(opts.onlyFinishMatch){
      const f = getElFinishes(el);
      if(!opts.onlyFinishMatch(f)) return;
    }
    // Modo isolateIds: elementos NÃO listados ficam esmaecidos (referência fantasma)
    let isIsolated = true;
    if(opts.isolateIds){
      isIsolated = opts.isolateIds.has(el.id);
    }
    const d = document.createElement('div');
    d.style.cssText = `
      position:absolute;
      left:${el.x * pxPerMm}px;
      top:${el.y * pxPerMm}px;
      width:${el.w * pxPerMm}px;
      height:${el.h * pxPerMm}px;
      transform:rotate(${el.rot || 0}deg);
      opacity:${isIsolated ? (el.opacity || 100)/100 : 0.08};
      ${!isIsolated ? 'filter:grayscale(100%);' : ''}
    `;
    paintStaticEl(d, el, pxPerMm, opts);
    wrap.appendChild(d);
  });

  return wrap;
}

/* Reescala font-size em px dos spans rich-text para o contexto do PDF.
   No editor, font-size é salvo como (size * MM_PER_PT * pxmm()) px.
   No PDF temos um pxPerMm diferente — precisa ajustar proporcionalmente. */
function rescaleHtmlForPdf(html, pdfPxPerMm){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const editorPpm = pxmm();
  tmp.querySelectorAll('[style*="font-size"]').forEach(node=>{
    const fs = node.style.fontSize;
    const m = fs && fs.match(/^([\d.]+)px$/);
    if(m){
      const cssPxInEditor = parseFloat(m[1]);
      // Converte de px-editor para mm para px-PDF
      const mm = cssPxInEditor / editorPpm;
      // 1mm ≈ 3.78px em 96dpi; usamos o pxPerMm passado
      const pdfPx = mm * pdfPxPerMm;
      node.style.fontSize = pdfPx + 'px';
    }
  });
  return tmp.innerHTML;
}

/* Pinta um elemento individualmente em HTML estático (sem interatividade). */
function paintStaticEl(d, el, pxPerMm, opts){
  opts = opts || {};
  if(el.type === 'text'){
    d.style.color = el.color || '#000';
    d.style.fontFamily = `'${el.font || 'Inter'}', sans-serif`;
    d.style.fontSize = (el.size * pxPerMm * 0.353) + 'px'; // pt → mm → px
    d.style.fontWeight = el.weight || 400;
    d.style.fontStyle = el.italic ? 'italic' : 'normal';
    d.style.textAlign = el.align || 'left';
    d.style.lineHeight = el.lh || el.lineHeight || 1.2;
    d.style.letterSpacing = ((el.ls || el.tracking || 0) * pxPerMm / 4) + 'px';
    d.style.textTransform = el.transform || 'none';
    d.style.whiteSpace = 'pre-wrap';
    d.style.wordBreak = 'break-word';
    d.style.display = 'flex';
    d.style.alignItems = el.valign === 'middle' ? 'center' : (el.valign === 'bottom' ? 'flex-end' : 'flex-start');
    d.style.justifyContent = el.align === 'center' ? 'center' : (el.align === 'right' ? 'flex-end' : 'flex-start');
    const span = document.createElement('span');
    span.className = 'txt';  // pra ANVISA selecionar + pra rich text
    span.style.cssText = 'width:100%;display:block';
    if(el.html && el.html.includes('<span')){
      span.innerHTML = rescaleHtmlForPdf(el.html, pxPerMm);
    } else {
      span.textContent = el.text || '';
    }
    d.appendChild(span);
  } else if(el.type === 'rect' || el.type === 'box'){
    d.style.background = el.fill || 'transparent';
    // suporta tanto el.strokeWidth quanto el.sw (editor usa sw)
    const sw = (el.strokeWidth || el.sw || 0);
    if(el.stroke && sw > 0){
      d.style.boxShadow = `0 0 0 ${sw * pxPerMm}px ${el.stroke}`;
    }
    if(el.radius) d.style.borderRadius = (el.radius * pxPerMm) + 'px';
  } else if(el.type === 'ellipse'){
    d.style.background = el.fill || 'transparent';
    const sw = (el.strokeWidth || el.sw || 0);
    if(el.stroke && sw > 0){
      d.style.border = `${sw * pxPerMm}px solid ${el.stroke}`;
    }
    d.style.borderRadius = '50%';
  } else if(el.type === 'line'){
    const sw = el.strokeWidth || el.sw || 1;
    const inner = document.createElement('div');
    inner.style.cssText = `position:absolute;left:0;top:50%;width:100%;height:${sw * pxPerMm}px;transform:translateY(-50%);background:${el.stroke || '#000'}`;
    d.appendChild(inner);
  } else if(el.type === 'image' && el.src){
    const img = document.createElement('img');
    img.src = el.src;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
    d.appendChild(img);
  } else if(el.type === 'shape'){
    // Reusa a função do editor que gera o SVG dinamicamente
    if(typeof shapeSVG === 'function'){
      d.appendChild(shapeSVG(el, pxPerMm));
    }
  } else if(el.type === 'selo'){
    // Reusa a função do editor
    if(typeof seloSVG === 'function'){
      d.appendChild(seloSVG(el, pxPerMm));
    }
  } else if(el.type === 'barcode'){
    // Reusa a função real do editor (que gera barras CODE 128 reais, não simplificação)
    if(typeof barcodeSVG === 'function'){
      d.appendChild(barcodeSVG(el, pxPerMm));
    }
  } else if(el.type === 'qr'){
    // Reusa qrSVG do editor (gera QR real a partir de el.seed)
    if(typeof qrSVG === 'function'){
      d.appendChild(qrSVG(el, pxPerMm));
    }
  } else if(el.type === 'textCurve'){
    // Reusa textCurveSVG do editor — renderiza texto curvado de verdade
    if(typeof textCurveSVG === 'function'){
      d.appendChild(textCurveSVG(el, pxPerMm));
    }
  }
}

          <div style="font-size:${5.5*pxPerMm}px;font-weight:800;letter-spacing:-0.01em">CanvaLabel</div>

         background:linear-gradient(135deg, #ff6a3d 0%, #e55524 100%);
         color:#fff;display:flex;align-items:center;justify-content:space-between;
         padding:0 ${10*pxPerMm}px">
      <div style="display:flex;align-items:center;gap:${3*pxPerMm}px">
        <div style="width:${8*pxPerMm}px;height:${8*pxPerMm}px;background:rgba(255,255,255,0.18);border-radius:${1.5*pxPerMm}px;
             display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${4*pxPerMm}px">CL</div>

  if(firstFace){
    const labelDiv = renderLabelStatic(firstFace, pxPerMm * previewScale);
    previewArea.appendChild(labelDiv);
  }

  // Pequeno delay pra fontes/imagens carregarem
  await new Promise(r => setTimeout(r, 200));

  await captureToPdfPage(pdf, container, pageInfo);
  removeRenderContainer(container);
}

/* Retorna HTML inline do swatch da cor pra usar na legenda */
function getLegendSwatch(kind, sizePx){
  const sz = `width:${sizePx}px;height:${sizePx}px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);flex:none`;
  if(kind === 'cmyk'){
    return `<div style="${sz};background:conic-gradient(#06b6d4 0% 25%, #ec4899 25% 50%, #fbbf24 50% 75%, #111 75% 100%)"></div>`;
  }
  if(kind === 'silver')      return `<div style="${sz};background:linear-gradient(135deg,#c8c8d0,#fff 35%,#a8a8b0 75%,#fff)"></div>`;
  if(kind === 'gold')        return `<div style="${sz};background:linear-gradient(135deg,#d4a554,#fce8a5 35%,#b88b3a 75%,#f5d182)"></div>`;
  if(kind === 'copper')      return `<div style="${sz};background:linear-gradient(135deg,#b87333,#e8a87c 35%,#8b5a2b 75%,#d49060)"></div>`;
  if(kind === 'holografico') return `<div style="${sz};background:linear-gradient(135deg,#ffb8d8,#bce6ff 25%,#d4ffbf 50%,#ffd9a8 75%,#e8b8ff)"></div>`;
  if(kind === 'verniz')      return `<div style="${sz};background:radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.3));border:1.5px solid #999"></div>`;
  if(kind === 'bxr')         return `<div style="${sz};background:linear-gradient(135deg,#555,#2a2a2a);box-shadow:inset 0 1px 2px rgba(0,0,0,0.5)"></div>`;
  return `<div style="${sz};background:#9ca3af"></div>`;
}

             display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${3.2*pxPerMm}px">CL</div>
        <div>
          <div style="font-size:${3*pxPerMm}px;font-weight:800;letter-spacing:-0.01em">canvalabel.com</div>

  return {

    contentTop: (HEADER_MM + 4) * pxPerMm,

}

/* ===== PÁGINAS 2+: Rótulo CMYK (uma por face) =====
   Mostra o rótulo completo em escala maior, centralizado.
   Header/footer iguais aos da página 1 para consistência. */
async function buildLabelPage(pdf, pageInfo, faceId, pageNum, totalPages){
  const container = createRenderContainer(pageInfo.w, pageInfo.h);
  const pxPerMm = parseFloat(container.dataset.pxPerMm);

  const faceLabel = faceId.charAt(0).toUpperCase() + faceId.slice(1);
  const labelW = state.editor.label.w;
  const labelH = state.editor.label.h;

  // Calcula escala pra ocupar bem o espaço útil (entre header e footer + sumário)
  const availW = pageInfo.w - 30; // mm
  const availH = pageInfo.h - 70; // mm
  const scale = Math.min(availW / labelW, availH / labelH, 2.5);

  // Legenda da página
  const finishGroups = collectFinishGroups();
  const legendItems = [
    { swatch:'cmyk', label:'CMYK', highlight:true },
    ...finishGroups.map(g => ({ swatch:g.swatchKey, label:g.name })),
  ];

  const shell = pdfPageShell({
    pxPerMm, pageInfo,
    subtitle: `RÓTULO · ${faceLabel.toUpperCase()}`,
    pageNum, totalPages, legendItems,
  });

  container.innerHTML = `
    ${shell.headerHTML}
    ${shell.legendHTML}
    <div id="labelArea" style="position:absolute;left:0;right:0;
         top:${shell.contentTop}px;bottom:${shell.contentBottom}px;
         display:flex;justify-content:center;align-items:center;
         padding:${5*pxPerMm}px"></div>
    ${shell.footerHTML}
  `;

  const labelArea = container.querySelector('#labelArea');
  const labelDiv = renderLabelStatic(faceId, pxPerMm * scale);
  // Adiciona contorno tracejado azul claro como guia da área de impressão
  labelDiv.style.boxShadow = `0 0 0 1px #cbd5e1, 0 ${4*pxPerMm}px ${12*pxPerMm}px rgba(0,0,0,0.12)`;
  labelArea.appendChild(labelDiv);

  await new Promise(r => setTimeout(r, 200));
  await captureToPdfPage(pdf, container, pageInfo);
  removeRenderContainer(container);
}

/* ===== PÁGINAS DE ACABAMENTO ISOLADO =====
   Mostra só os elementos que recebem aquele acabamento,
   em destaque sobre fundo branco. Resto do rótulo fica esmaecido. */
async function buildFinishPage(pdf, pageInfo, group, pageNum, totalPages){
  const container = createRenderContainer(pageInfo.w, pageInfo.h);
  const pxPerMm = parseFloat(container.dataset.pxPerMm);

  // Agrupa por face pra renderizar cada uma com o acabamento isolado
  const byFace = {};
  group.items.forEach(it => {
    if(!byFace[it.faceId]) byFace[it.faceId] = [];
    byFace[it.faceId].push(it.el.id);
  });
  const faces = Object.keys(byFace);
  const primaryFace = faces[0];
  const isolateIds = new Set(byFace[primaryFace] || []);

  const labelW = state.editor.label.w;
  const labelH = state.editor.label.h;
  const radius = state.editor.label.radius || 0;
  const availW = pageInfo.w - 30;
  const availH = pageInfo.h - 70;
  const scale = Math.min(availW / labelW, availH / labelH, 2.5);

  const shell = pdfPageShell({
    pxPerMm, pageInfo,
    subtitle: group.name.toUpperCase(),
    pageNum, totalPages,
    legendItems: [{ swatch: group.swatchKey, label: group.name, highlight: true }],
  });

  container.innerHTML = `
    ${shell.headerHTML}
    ${shell.legendHTML}
    <div id="labelArea" style="position:absolute;left:0;right:0;
         top:${shell.contentTop}px;bottom:${shell.contentBottom}px;
         display:flex;flex-direction:column;justify-content:center;align-items:center;
         padding:${5*pxPerMm}px"></div>
    ${shell.footerHTML}
  `;

  const labelArea = container.querySelector('#labelArea');

  // Wrapper que combina:
  // 1. Retângulo branco com borda fina (a "faca" / referência espacial)
  // 2. Elementos do acabamento renderizados em preto sólido sobre ele
  const labelWpx = labelW * pxPerMm * scale;
  const labelHpx = labelH * pxPerMm * scale;
  const dieWrapper = document.createElement('div');
  dieWrapper.style.cssText = `
    position:relative;
    width:${labelWpx}px;
    height:${labelHpx}px;
    background:#fff;
    border:${0.4 * pxPerMm}px solid #d1d5db;
    border-radius:${radius * pxPerMm * scale}px;
    overflow:hidden;
  `;

  // Renderiza apenas os elementos do acabamento, em PRETO SÓLIDO (silhueta)
  const els = state.editor.faces[primaryFace] || [];
  els.forEach(el=>{
    if(!isolateIds.has(el.id)) return;  // só os do acabamento
    if(!el.visible) return;
    const d = document.createElement('div');
    d.style.cssText = `
      position:absolute;
      left:${el.x * pxPerMm * scale}px;
      top:${el.y * pxPerMm * scale}px;
      width:${el.w * pxPerMm * scale}px;
      height:${el.h * pxPerMm * scale}px;
      transform:rotate(${el.rot || 0}deg);
    `;
    paintBlackMaskEl(d, el, pxPerMm * scale);
    dieWrapper.appendChild(d);
  });

  // Sombra discreta abaixo pro PDF não ficar plano demais
  dieWrapper.style.boxShadow = `0 ${4*pxPerMm}px ${12*pxPerMm}px rgba(0,0,0,0.08)`;
  labelArea.appendChild(dieWrapper);

  // Texto auxiliar abaixo
  const note = document.createElement('div');
  note.style.cssText = `margin-top:${5*pxPerMm}px;font-size:${2.6*pxPerMm}px;color:#6b7280;text-align:center;max-width:${(pageInfo.w-40)*pxPerMm}px;line-height:1.5`;
  note.innerHTML = `Máscara de aplicação · <b style="color:#111">${group.name}</b> · As áreas em preto recebem o acabamento. A linha fina representa o contorno da faca para referência espacial.`;
  labelArea.appendChild(note);

  await new Promise(r => setTimeout(r, 200));
  await captureToPdfPage(pdf, container, pageInfo);
  removeRenderContainer(container);
}

/* Pinta um elemento como MÁSCARA PRETA (silhueta sólida).
   Usado nas páginas de acabamento. Texto vira preto, formas viram pretas,
   imagens viram silhueta preta com mix-blend-mode, SVGs viram pretos. */
function paintBlackMaskEl(d, el, pxPerMm){
  if(el.type === 'text' || el.type === 'textCurve'){
    d.style.color = '#000';
    d.style.fontFamily = `'${el.font || 'Inter'}', sans-serif`;
    d.style.fontSize = (el.size * pxPerMm * 0.353) + 'px';
    d.style.fontWeight = el.weight || 400;
    d.style.fontStyle = el.italic ? 'italic' : 'normal';
    d.style.textAlign = el.align || 'left';
    d.style.lineHeight = el.lineHeight || 1.2;
    d.style.letterSpacing = (el.tracking || 0) + 'em';
    d.style.textTransform = el.transform || 'none';
    d.style.whiteSpace = 'pre-wrap';
    d.style.wordBreak = 'break-word';
    d.style.display = 'flex';
    d.style.alignItems = el.valign === 'middle' ? 'center' : (el.valign === 'bottom' ? 'flex-end' : 'flex-start');
    d.style.justifyContent = el.align === 'center' ? 'center' : (el.align === 'right' ? 'flex-end' : 'flex-start');
    const span = document.createElement('span');
    span.style.cssText = 'width:100%;display:block';
    span.textContent = el.text || '';
    d.appendChild(span);
  } else if(el.type === 'rect' || el.type === 'box'){
    // Preto sólido se tinha fill; outline preto se era só borda
    if(el.fill && el.fill !== 'transparent' && el.fill !== 'none'){
      d.style.background = '#000';
    } else if(el.stroke && el.strokeWidth > 0){
      d.style.background = 'transparent';
      d.style.border = `${el.strokeWidth * pxPerMm * 0.5}px solid #000`;
    } else {
      d.style.background = '#000';  // default fallback
    }
    if(el.radius) d.style.borderRadius = (el.radius * pxPerMm) + 'px';
  } else if(el.type === 'ellipse'){
    if(el.fill && el.fill !== 'transparent' && el.fill !== 'none'){
      d.style.background = '#000';
    } else {
      d.style.border = `${(el.strokeWidth || 1) * pxPerMm * 0.5}px solid #000`;
    }
    d.style.borderRadius = '50%';
  } else if(el.type === 'line'){
    const thick = (el.strokeWidth || 1) * pxPerMm * 0.5;
    d.style.background = '#000';
    d.style.height = thick + 'px';
    d.style.top = (parseFloat(d.style.top) + (el.h * pxPerMm - thick)/2) + 'px';
  } else if(el.type === 'image' && el.src){
    // Imagens: silhueta preta usando filtro (contrast + brightness extremo)
    const img = document.createElement('img');
    img.src = el.src;
    img.style.cssText = `
      width:100%;height:100%;object-fit:contain;display:block;
      filter:brightness(0) contrast(100);
    `;
    d.appendChild(img);
  } else if(el.type === 'shape' && el.shapeSVG){
    d.innerHTML = el.shapeSVG;
    const svg = d.querySelector('svg');
    if(svg){
      svg.style.cssText = 'width:100%;height:100%;display:block';
      // Força todos os preenchimentos e contornos pra preto
      svg.querySelectorAll('*').forEach(node=>{
        if(node.hasAttribute('fill') && node.getAttribute('fill') !== 'none'){
          node.setAttribute('fill', '#000');
        }
        if(node.hasAttribute('stroke') && node.getAttribute('stroke') !== 'none'){
          node.setAttribute('stroke', '#000');
        }
      });
    }
  } else if(el.type === 'selo' && el.seloSVG){
    d.innerHTML = el.seloSVG;
    const svg = d.querySelector('svg');
    if(svg){
      svg.style.cssText = 'width:100%;height:100%;display:block';
      // Mesmo tratamento: tudo preto
      svg.querySelectorAll('*').forEach(node=>{
        if(node.hasAttribute('fill') && node.getAttribute('fill') !== 'none'){
          node.setAttribute('fill', '#000');
        }
        if(node.hasAttribute('stroke') && node.getAttribute('stroke') !== 'none'){
          node.setAttribute('stroke', '#000');
        }
      });
    }
  } else {
    // Tipo desconhecido: caixa preta simples
    d.style.background = '#000';
  }
}

/* ===== ÚLTIMA PÁGINA: Faca (die-cut) cotada =====
   Mostra apenas o contorno do rótulo em laranja/vermelho, com cotas em mm.
   Inspirado na página 3 do PDF do Artvie. */
async function buildDieCutPage(pdf, pageInfo, pageNum, totalPages){
  const container = createRenderContainer(pageInfo.w, pageInfo.h);
  const pxPerMm = parseFloat(container.dataset.pxPerMm);

  const labelW = state.editor.label.w;
  const labelH = state.editor.label.h;
  const radius = state.editor.label.radius || 0;

  // Escala pra ocupar bem a área central
  const availW = pageInfo.w - 60;
  const availH = pageInfo.h - 90;
  const scale = Math.min(availW / labelW, availH / labelH, 2.5);

  const shell = pdfPageShell({
    pxPerMm, pageInfo,
    subtitle: 'FACA · CORTE',
    pageNum, totalPages,
    legendItems: [],
  });

  const labelWpx = labelW * pxPerMm * scale;
  const labelHpx = labelH * pxPerMm * scale;
  const cotaOffset = 12 * pxPerMm;
  const arrow = 2.5 * pxPerMm;
  const svgW = labelWpx + cotaOffset * 3;
  const svgH = labelHpx + cotaOffset * 3;

  container.innerHTML = `
    ${shell.headerHTML}
    ${shell.legendHTML}

    <div style="position:absolute;left:${10*pxPerMm}px;top:${shell.contentTop}px;
         color:#374151;font-size:${3.2*pxPerMm}px;font-weight:800;letter-spacing:-0.01em">
      FACA
    </div>

    <div style="position:absolute;left:0;right:0;top:${shell.contentTop + 8*pxPerMm}px;bottom:${shell.contentBottom}px;
         display:flex;justify-content:center;align-items:center;padding:${5*pxPerMm}px">
      <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
        <!-- Cota horizontal (largura) acima do retângulo -->
        <line x1="${cotaOffset}" y1="${cotaOffset - 4*pxPerMm}" x2="${cotaOffset + labelWpx}" y2="${cotaOffset - 4*pxPerMm}" stroke="#ef4444" stroke-width="${0.4*pxPerMm}"/>
        <polygon points="${cotaOffset},${cotaOffset - 4*pxPerMm} ${cotaOffset + arrow},${cotaOffset - 4*pxPerMm - arrow*0.6} ${cotaOffset + arrow},${cotaOffset - 4*pxPerMm + arrow*0.6}" fill="#ef4444"/>
        <polygon points="${cotaOffset + labelWpx},${cotaOffset - 4*pxPerMm} ${cotaOffset + labelWpx - arrow},${cotaOffset - 4*pxPerMm - arrow*0.6} ${cotaOffset + labelWpx - arrow},${cotaOffset - 4*pxPerMm + arrow*0.6}" fill="#ef4444"/>
        <text x="${cotaOffset + labelWpx/2}" y="${cotaOffset - 6*pxPerMm}" text-anchor="middle" fill="#ef4444" font-size="${3*pxPerMm}" font-style="italic" font-family="Inter, sans-serif" font-weight="500">${labelW} mm</text>

        <!-- Cota vertical (altura) à direita do retângulo -->
        <line x1="${cotaOffset + labelWpx + 4*pxPerMm}" y1="${cotaOffset}" x2="${cotaOffset + labelWpx + 4*pxPerMm}" y2="${cotaOffset + labelHpx}" stroke="#ef4444" stroke-width="${0.4*pxPerMm}"/>
        <polygon points="${cotaOffset + labelWpx + 4*pxPerMm},${cotaOffset} ${cotaOffset + labelWpx + 4*pxPerMm - arrow*0.6},${cotaOffset + arrow} ${cotaOffset + labelWpx + 4*pxPerMm + arrow*0.6},${cotaOffset + arrow}" fill="#ef4444"/>
        <polygon points="${cotaOffset + labelWpx + 4*pxPerMm},${cotaOffset + labelHpx} ${cotaOffset + labelWpx + 4*pxPerMm - arrow*0.6},${cotaOffset + labelHpx - arrow} ${cotaOffset + labelWpx + 4*pxPerMm + arrow*0.6},${cotaOffset + labelHpx - arrow}" fill="#ef4444"/>
        <text x="${cotaOffset + labelWpx + 6*pxPerMm}" y="${cotaOffset + labelHpx/2}" text-anchor="middle" fill="#ef4444" font-size="${3*pxPerMm}" font-style="italic" font-family="Inter, sans-serif" font-weight="500"
              transform="rotate(90 ${cotaOffset + labelWpx + 6*pxPerMm} ${cotaOffset + labelHpx/2})">${labelH} mm</text>

        <!-- Retângulo da faca -->
        <rect x="${cotaOffset}" y="${cotaOffset}" width="${labelWpx}" height="${labelHpx}"
              rx="${radius * pxPerMm * scale}" ry="${radius * pxPerMm * scale}"
              fill="none" stroke="#ef4444" stroke-width="${0.6*pxPerMm}"/>
      </svg>
    </div>

    <div style="position:absolute;left:${10*pxPerMm}px;right:${10*pxPerMm}px;
         bottom:${(18 + 18) * pxPerMm}px;
         color:#ef4444;font-size:${2.3*pxPerMm}px;font-weight:600;line-height:1.5">
      CONFERIR MEDIDA DO RÓTULO CONFORME EMBALAGEM<br>
      (RECOMENDAMOS UMA PROVA DE FACA PARA TESTAR MARGENS)
    </div>

    ${shell.footerHTML}
  `;

  await new Promise(r => setTimeout(r, 200));
  await captureToPdfPage(pdf, container, pageInfo);
  removeRenderContainer(container);
}

// Cache de quais fontes já foram lazy-loaded
const FONTS_LOADED = new Set([...FONTS_PRELOADED]);

/* Lazy-load: injeta um <link> ao Google Fonts pra essa família */
function ensureFontLoaded(family){
  if(!family || FONTS_LOADED.has(family)) return;
  FONTS_LOADED.add(family);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  // pede vários pesos para a fonte renderizar bem em bold, regular, etc.
  const fam = family.trim().replace(/ /g, '+');
  link.href = `https://fonts.googleapis.com/css2?family=${fam}:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap`;
  document.head.appendChild(link);
}

/* Pré-carrega as fontes em destaque (para que o preview do dropdown
   apareça com a fonte real, não com fallback). */
function preloadFeaturedFonts(){
  // chama em background sem bloquear
  setTimeout(()=>{
    FONTS_FEATURED.forEach(f => ensureFontLoaded(f));
  }, 800);
}

/* Pré-carrega as fontes usadas nos templates (display, body, accent, label) */
function preloadTemplateFonts(){
  TEMPLATES.forEach(t=>{
    if(!t.fonts) return;
    Object.values(t.fonts).forEach(f => ensureFontLoaded(f));
  });
}

   de organizações certificadoras (eureciclo etc.), o usuário pode subir

const SELO_SVGS = {

  /* --- Triângulo de Möbius ISO 7000-1135 — desenhado com 3 setas
     simétricas (120° de rotação cada). Cada "seta" é um triângulo
     com um corte que forma a flecha. Geometria validada visualmente.
     OBS: Mantido como fallback. Os SVGs oficiais reais são usados via
     MATERIAL_SVGS lookup nas funções pet/pead/etc. --- */
  _mobius: (num, label) => `
    <g fill="currentColor">
      <g transform="translate(50 47)">
        <g>
          <path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z" />
          <path d="M 16 -22 L 22 -14 L 8 -8 Z" />
        </g>
        <g transform="rotate(120)">
          <path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z" />
          <path d="M 16 -22 L 22 -14 L 8 -8 Z" />
        </g>
        <g transform="rotate(240)">
          <path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z" />
          <path d="M 16 -22 L 22 -14 L 8 -8 Z" />
        </g>
      </g>
      <text x="50" y="56" font-family="Archivo,Arial,sans-serif" font-size="22"
        font-weight="800" text-anchor="middle" fill="currentColor">${num}</text>
      ${label ? `<text x="50" y="93" font-family="Archivo,Arial,sans-serif" font-size="14"
        font-weight="800" text-anchor="middle" fill="currentColor" letter-spacing="0.4">${label}</text>` : ''}
    </g>`,

  /* === Materiais — usa SVGs oficiais fornecidos pelo usuário ===
     Lookup em MATERIAL_SVGS por chave. Fallback para _mobius desenhado. */
  pet:    () => MATERIAL_SVGS.pet    ? MATERIAL_SVGS.pet.inner    : SELO_SVGS._mobius(1, 'PET'),
  pead:   () => MATERIAL_SVGS.pead   ? MATERIAL_SVGS.pead.inner   : SELO_SVGS._mobius(2, 'PEAD'),
  pvc:    () => MATERIAL_SVGS.pvc    ? MATERIAL_SVGS.pvc.inner    : SELO_SVGS._mobius(3, 'PVC'),
  pebd:   () => MATERIAL_SVGS.pebd   ? MATERIAL_SVGS.pebd.inner   : SELO_SVGS._mobius(4, 'PEBD'),
  pp:     () => MATERIAL_SVGS.pp     ? MATERIAL_SVGS.pp.inner     : SELO_SVGS._mobius(5, 'PP'),
  ps:     () => MATERIAL_SVGS.ps     ? MATERIAL_SVGS.ps.inner     : SELO_SVGS._mobius(6, 'PS'),
  outros: () => MATERIAL_SVGS.outros ? MATERIAL_SVGS.outros.inner : SELO_SVGS._mobius(7, 'OUTROS'),
  // Materiais não-plásticos
  pap:    () => MATERIAL_SVGS.pap    ? MATERIAL_SVGS.pap.inner    : '',
  alu:    () => MATERIAL_SVGS.alu    ? MATERIAL_SVGS.alu.inner    : '',
  gls:    () => MATERIAL_SVGS.gls    ? MATERIAL_SVGS.gls.inner    : '',

  /* === Selo "RECICLÁVEL" — SVG oficial fornecido (Möbius europeu padrão) === */
  reciclavel: () => RECYCLING_SVGS.reciclavel
    ? RECYCLING_SVGS.reciclavel.inner
    : `<g fill="currentColor"><g transform="translate(50 40)"><path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z"/><path d="M 16 -22 L 22 -14 L 8 -8 Z"/><g transform="rotate(120)"><path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z"/><path d="M 16 -22 L 22 -14 L 8 -8 Z"/></g><g transform="rotate(240)"><path d="M -16 -22 L 16 -22 L 8 -8 L -8 -8 Z"/><path d="M 16 -22 L 22 -14 L 8 -8 Z"/></g></g><text x="50" y="92" font-family="Archivo,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="currentColor" letter-spacing="1">RECICLÁVEL</text></g>`,

  /* === Selo "eureciclo" — SVG oficial fornecido ===
     Logo da plataforma de compensação ambiental Eureciclo. */
  eureciclo: () => RECYCLING_SVGS.eureciclo
    ? RECYCLING_SVGS.eureciclo.inner
    : `<g fill="currentColor"><circle cx="50" cy="44" r="26" fill="none" stroke="currentColor" stroke-width="3.5"/><text x="50" y="50" font-family="Archivo,Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor">EURECICLO</text></g>`,

  /* === Selo "Jogue no Lixo" — SVG oficial fornecido ===
     Selo brasileiro: figura jogando lixo na lixeira de reciclagem. */
  jogueLixo: () => RECYCLING_SVGS.jogueLixo
    ? RECYCLING_SVGS.jogueLixo.inner
    : `<g fill="currentColor"><rect x="32" y="28" width="36" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="92" font-family="Archivo,Arial,sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="currentColor">JOGUE NO LIXO</text></g>`,


  /* === Vegano — SVG oficial fornecido pelo usuário ===
     Logo "VEGAN" com folha estilizada. Inclui texto integrado. */
  vegano: () => ETHICAL_SVGS.vegano
    ? ETHICAL_SVGS.vegano.inner
    : `<g fill="currentColor"><path d="M 50 14 C 32 14, 22 28, 22 44 C 22 58, 32 68, 48 70 C 48 70, 50 56, 50 14 Z M 50 14 C 68 14, 78 28, 78 44 C 78 58, 68 68, 52 70 C 52 70, 50 56, 50 14 Z" /><text x="50" y="92" font-family="Archivo,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="currentColor" letter-spacing="1.5">VEGAN</text></g>`,

  /* === Cruelty Free / Não testado em animais — SVG oficial fornecido ===
     "Não testado em animais" em PT-BR. Inclui texto e ilustração de coelho.
     Tanto crueltyFree quanto naoTestado usam o mesmo SVG (são o mesmo selo). */
  crueltyFree: () => ETHICAL_SVGS.crueltyFree
    ? ETHICAL_SVGS.crueltyFree.inner
    : `<g fill="currentColor"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="55" font-family="Archivo,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="currentColor">CRUELTY FREE</text></g>`,

  naoTestado: () => ETHICAL_SVGS.crueltyFree
    ? ETHICAL_SVGS.crueltyFree.inner
    : `<g fill="currentColor"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="55" font-family="Archivo,Arial,sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="currentColor">NÃO TESTADO</text></g>`,

  /* === PAO (Period After Opening) ISO 15223-1 ===
     Usa SVGs oficiais fornecidos pelo usuário. viewBox 0 0 1000 1000.
     Para meses não cadastrados, faz fallback no 12M com texto sobreposto. */
  _pao: (months) => {
    const svg = PAO_SVGS[months];
    if(svg) return svg;
    // Fallback: usa o 12M como base e sobrepõe o texto
    const base = PAO_SVGS['12M'] || '';
    return base;
  },
};

/* Retorna o path SVG de uma forma da galeria */
function getShapeSVG(shapeKind){
  const s = SHAPE_LIB[shapeKind];
  if(!s) return '<rect width="100" height="100" fill="currentColor"/>';
  return `<path d="${s.path}" fill="currentColor"/>`;
}

/* Lista shapes agrupados por categoria */
function getShapesByCategory(){
  const cats = {};
  Object.entries(SHAPE_LIB).forEach(([key, s])=>{
    if(!cats[s.cat]) cats[s.cat] = [];
    cats[s.cat].push({ key, name:s.name });
  });
  return cats;
}

/* Mapa de "seloKind do estado" → "kind do SVG library" */

  // kind do estado pode ser: 'vegano', 'recic' (materialReciclavel), 'eurec' (euReciclo),
  // 'cf' (crueltyFree), 'nt' (naoTestado), 'mat' (tipoMaterial — com label PET/PEAD/...),
  // 'pao' (validade — com label 12M/24M/...)
  return kind;
}

/* Retorna o SVG string completo de um selo */
function getSeloSVG(seloKind, color){
  const fn = SELO_SVGS[seloKind];
  if(!fn){
    // fallback: símbolo de placeholder com a label
    return `<g fill="${color||'currentColor'}">
      <rect x="10" y="10" width="80" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>

        font-weight="800" text-anchor="middle" fill="currentColor">${seloKind}</text>
    </g>`;
  }
  return fn();
}

/* ============================================================
   REVISOR ANVISA — checagem de conformidade do rótulo
   Base: RDC 907/2024 (Art. 13) — dados obrigatórios na rotulagem
   de produtos cosméticos, higiene pessoal e perfumes.
   Estratégia: regras puras em JS sobre o estado do wizard + state
   dos elementos do editor. Cada regra retorna {ok, level, ...}.
============================================================ */

/* Helper: combina o texto de todos os elementos de TODAS as faces
   em uma única string para checagens de conteúdo (busca substring). */
function anvisaAllText(){
  const allFaces = Object.values(E().faces || {});
  const texts = [];
  allFaces.forEach(face => face.forEach(el=>{
    if(el.type === 'text' || el.type === 'textCurve'){
      if(el.text) texts.push(el.text);
    }
  }));
  return texts.join(' \n ').toLowerCase();
}

/* Verifica se existe um elemento de texto contendo certo padrão.
   Retorna o id do primeiro elemento encontrado, ou null. */
function anvisaFindTextEl(regex){
  const allFaces = Object.entries(E().faces || {});
  for(const [face, els] of allFaces){
    for(const el of els){
      if((el.type === 'text' || el.type === 'textCurve') && el.text){
        if(regex.test(el.text)) return { id: el.id, face, el };
      }
    }
  }
  return null;
}

/* Conta selos presentes no editor */
function anvisaHasSelo(seloKind){
  const allFaces = Object.values(E().faces || {});
  for(const face of allFaces){
    for(const el of face){
      if(el.type === 'selo' && el.seloKind === seloKind) return true;
    }
  }
  return false;
}

/* Conta elementos com tamanho de fonte abaixo de um mínimo */
function anvisaCountSmallText(minPt){
  const allFaces = Object.values(E().faces || {});
  let count = 0, smallestId = null, smallest = Infinity;
  allFaces.forEach(face => face.forEach(el=>{
    if((el.type === 'text' || el.type === 'textCurve') && el.text && el.size){
      if(el.size < minPt){
        count++;
        if(el.size < smallest){ smallest = el.size; smallestId = el.id; }
      }
    }
  }));
  return { count, smallest, smallestId };
}

/* ============================================================
   REGRAS ANVISA
   Cada função recebe o state global e retorna um array de issues.
   Issue: { level, title, desc, ref, action?, goto? }
   level: 'crit' (obrigatório), 'warn' (recomendado), 'info' (sugestão)
   action: { label, kind, payload } — botão de "ir para problema"
============================================================ */

function anvisaRunChecks(){
  const s = state, sv = s.verso, sf = s.frente, ss = s.selos;
  const allText = anvisaAllText();
  const issues = [];

  // --- 1. NOME DO PRODUTO (frente) ---
  if(!sf.nome || !sf.nome.trim()){
    issues.push({
      level:'crit', cat:'identificacao',
      title:'Nome do produto ausente',
      desc:'O rótulo deve conter o nome do produto que o identifique e distinga dos demais.',
      ref:'RDC 907/2024, Art. 13, I, "a"',
      action:{label:'Preencher na etapa 6', kind:'wizard', step:6}
    });
  }

  // --- 2. MARCA ---
  if(!sf.marca || !sf.marca.trim()){
    issues.push({
      level:'crit', cat:'identificacao',
      title:'Marca não informada',
      desc:'Deve constar a marca registrada do produto.',
      ref:'RDC 907/2024, Art. 13, I, "b"',
      action:{label:'Preencher na etapa 6', kind:'wizard', step:6}
    });
  }

  // --- 3. NÚMERO DE REGISTRO / NOTIFICAÇÃO ANVISA ---
  // Aceita formatos: ANVISA seguido de número, ou MS seguido de número, ou nº de notificação
  const hasReg = /\b(?:anvisa|m\.?s\.?)\s*[:nº\s\-]*\d{3,}/i.test(allText)
              || /notifica[çc][ãa]o\s*[:nº\s\-]*\d{3,}/i.test(allText)
              || /\bn[.°º]\s*\d{8,}/.test(allText);
  if(!hasReg){
    issues.push({
      level:'crit', cat:'registro',
      title:'Número de registro ou notificação ANVISA ausente',
      desc:'Produtos Grau 1 devem trazer o número de notificação; Grau 2 o número de registro. Formato comum: "ANVISA nº XXXXXXX" ou "MS nº XXXXXXX".',
      ref:'RDC 907/2024, Art. 13, I, "c"',
      action:{label:'Adicionar na etapa 4 (verso)', kind:'wizard', step:4}
    });
  }

  // --- 4. PAÍS DE ORIGEM ---
  const hasOrigin = /\b(ind[uú]stria|fabricado|made in|origem)\b/i.test(allText)
                 || /\bbrasil(eira|eiro)?\b/i.test(allText);
  if(!hasOrigin){
    issues.push({
      level:'crit', cat:'identificacao',
      title:'País de origem não declarado',
      desc:'Deve constar a expressão "Indústria Brasileira" ou similar indicando o país de produção/industrialização.',
      ref:'RDC 907/2024, Art. 13, I, "d"',
    });
  }

  // --- 5. RAZÃO SOCIAL + CIDADE/UF DO TITULAR ---
  // Sinais: "LTDA", "S.A.", "ME", "EIRELI", "EPP" são bons indicadores
  const hasRazaoSocial = /\b(ltda|s\.a\.?|s\/a|me|eireli|epp)\b/i.test(allText)
                     || /raz[ãa]o\s+social/i.test(allText);
  if(!hasRazaoSocial){
    issues.push({
      level:'crit', cat:'titular',
      title:'Razão social do titular não identificada',
      desc:'Deve constar a razão social completa da empresa titular da regularização.',
      ref:'RDC 907/2024, Art. 13, I, "e"',
    });
  }

  // --- 6. CNPJ DO TITULAR ---
  const hasCnpj = /\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/.test(allText)
               || /\bcnpj\b/i.test(allText);
  if(!hasCnpj){
    issues.push({
      level:'crit', cat:'titular',
      title:'CNPJ do titular não encontrado',
      desc:'O CNPJ é obrigatório. Formato: XX.XXX.XXX/XXXX-XX',
      ref:'RDC 907/2024, Art. 13, I, "g"',
    });
  }

  // --- 7. PRAZO DE VALIDADE ---
  const hasValidade = /\bvalidade\b/i.test(allText)
                   || /\bv[áa]l(ido|ida)/i.test(allText)
                   || /\bfabrica[cç][ãa]o\b/i.test(allText)
                   || /\bfab\.?\s*\/\s*val/i.test(allText)
                   || /\bvenc(imento)?\b/i.test(allText);
  if(!hasValidade){
    issues.push({
      level:'crit', cat:'rastreabilidade',
      title:'Prazo de validade não declarado',
      desc:'É obrigatório indicar o prazo de validade. Pode ser "Fab.: __/__ Val.: __/__" ou "Validade: ver embalagem".',
      ref:'RDC 907/2024, Art. 13, I, "h"',
    });
  }

  // --- 8. LOTE OU PARTIDA ---
  const hasLote = /\blote\b/i.test(allText) || /\bpartida\b/i.test(allText);
  if(!hasLote){
    issues.push({
      level:'crit', cat:'rastreabilidade',
      title:'Lote ou partida não declarado',
      desc:'É obrigatório indicar o lote ou partida do produto (geralmente impresso depois pela fábrica). No rótulo basta indicar "Lote: ver embalagem".',
      ref:'RDC 907/2024, Art. 13, I, "i"',
    });
  }

  // --- 9. CONTEÚDO NOMINAL (peso/volume) ---
  // Formato: número + ml|l|g|kg
  const hasConteudo = /\b\d+[,.]?\d*\s*(ml|mL|ML|l|L|g|G|kg|KG|mg|MG)\b/.test(allText);
  if(!hasConteudo){
    issues.push({
      level:'crit', cat:'conteudo',
      title:'Conteúdo nominal não declarado',
      desc:'O peso líquido ou volume nominal é obrigatório. Exemplo: "200ml", "50g", "1L".',
      ref:'RDC 907/2024, Art. 13, I, "j"',
    });
  }

  // --- 10. SAC / ATENDIMENTO AO CONSUMIDOR ---
  const hasSac = /\bsac\b/i.test(allText)
              || /atendimento\s+ao\s+consumidor/i.test(allText)
              || /\b0800[\s\-]?\d{3}/i.test(allText)
              || /\bconsumidor\b/i.test(allText);
  if(!hasSac){
    issues.push({
      level:'crit', cat:'sac',
      title:'Dados de atendimento ao consumidor ausentes',
      desc:'O SAC (telefone e/ou e-mail) é obrigatório desde 2022. Pode ser "SAC: 0800-XXX-XXXX" ou e-mail de contato.',
      ref:'RDC 907/2024, Art. 13, I, "o" (inclusão pela RDC 752/2022)',
      action:{label:'Preencher na etapa 4 (verso)', kind:'wizard', step:4}
    });
  }

  // --- 11. MATERIAL DA EMBALAGEM ---
  // Se algum selo de material foi escolhido (PET, PEAD, ...), está OK.
  // Se não, verifica se texto menciona material.
  const hasMatSelo = !!ss.tipoMaterial;
  const hasMatText = /\b(pet|pead|hdpe|pvc|pebd|ldpe|\bpp\b|\bps\b|polipropileno|polietileno|vidro|alum[íi]nio|papel)\b/i.test(allText);
  if(!hasMatSelo && !hasMatText){
    issues.push({
      level:'crit', cat:'embalagem',
      title:'Material da embalagem não identificado',
      desc:'A especificação do material da embalagem é obrigatória desde 2022. Pode ser pelo selo de reciclagem (Möbius com código 1-7) ou texto.',
      ref:'RDC 907/2024, Art. 13, I, "p" (inclusão pela RDC 752/2022)',
      action:{label:'Selecionar na etapa 5 (selos)', kind:'wizard', step:5}
    });
  }

  // --- 12. INGREDIENTES (INCI) ---
  // Sinais: presença de "ingredientes:", "composição:", "INCI", ou padrão de fórmula
  // (vários ingredientes separados por vírgula como "Aqua, Glycerin, ...")
  const hasIngred = /\b(ingredientes|composi[çc][ãa]o|inci)\s*[:\.]?\b/i.test(allText)
                 || /\baqua\s*,\s*(?:glycerin|sodium|cetearyl|paraffin|propylene|alcohol|glycol|cetyl)/i.test(allText);
  if(!hasIngred){
    issues.push({
      level:'crit', cat:'ingredientes',
      title:'Lista de ingredientes (INCI) ausente',
      desc:'Os ingredientes devem ser declarados em ordem decrescente de concentração, usando a nomenclatura INCI internacional. Desde 2024 (RDC 898/2024), também devem aparecer em português.',
      ref:'RDC 907/2024, Art. 13, I, "n" + RDC 898/2024',
      action:{label:'Preencher na etapa 4 (verso)', kind:'wizard', step:4}
    });
  }

  // --- 13. MODO DE USO ---
  const hasModo = /\b(modo\s+de\s+uso|aplica[çc][ãa]o|como\s+usar)/i.test(allText);
  if(!hasModo){
    issues.push({
      level:'warn', cat:'uso',
      title:'Modo de uso não declarado',
      desc:'Embora opcional para alguns produtos, o modo de uso é exigido para produtos que precisam de aplicação específica (fixadores, modeladores, alisantes etc.).',
      ref:'RDC 907/2024, Art. 13, III, "a"',
    });
  }

  // --- 14. PRAZO DE VALIDADE APÓS ABERTURA (PAO) ---
  // Se o usuário escolheu um PAO no wizard, OK. Senão, é AVISO.
  if(!ss.validadeAbertura){
    issues.push({
      level:'warn', cat:'rastreabilidade',
      title:'PAO (validade após abertura) não declarada',
      desc:'O símbolo do potinho com "XM" (Período After Opening) é boa prática para a maioria dos cosméticos com vida útil ≥ 30 meses. Indica em quantos meses o produto deve ser consumido após aberto.',
      ref:'Boa prática internacional (ISO 22716 / Reg. UE 1223/2009)',
      action:{label:'Selecionar na etapa 5 (selos)', kind:'wizard', step:5}
    });
  }

  // --- 15. TEXTOS MUITO PEQUENOS ---
  const small = anvisaCountSmallText(5);
  if(small.count > 0){
    issues.push({
      level:'warn', cat:'legibilidade',
      title:`${small.count} ${small.count===1?'texto':'textos'} com fonte muito pequena`,
      desc:`Encontramos ${small.count} ${small.count===1?'texto':'textos'} com menos de 5pt. Para garantir legibilidade na impressão, recomenda-se mínimo 6pt para textos secundários e 8pt para informações regulatórias.`,
      ref:'Boa prática gráfica para rotulagem (NBR / ABNT)',
      action: small.smallestId ? {label:'Ver o menor texto', kind:'select', id:small.smallestId} : null
    });
  }

  // --- 16. ADVERTÊNCIAS (genérico — para produtos com riscos) ---
  // Se algum texto menciona "atenção", "advertência", "evitar" — está OK.
  const hasAdvert = /\b(atenc[ãa]o|advert[êe]ncia|evitar|n[ãa]o\s+ing(?:eri|estion|erir))/i.test(allText);
  // Heurística: se NÃO há nenhuma advertência E o produto não é tipo perfume puro,
  // sugerir incluir (mas é só info, não crítico)
  if(!hasAdvert){
    issues.push({
      level:'info', cat:'seguranca',
      title:'Sugestão: incluir advertências de uso',
      desc:'Para a maioria dos cosméticos é boa prática incluir advertências como "Em caso de irritação, suspender o uso" ou "Manter fora do alcance de crianças".',
      ref:'RDC 907/2024, Art. 13, III, "b"',
    });
  }

  // --- 17. CLAIMS PROIBIDOS (medicinal/terapêutico) ---
  // Cosméticos NÃO podem prometer cura, prevenção ou tratamento de doenças
  const forbidden = [
    {pattern:/\b(cura|curativo|trata\s+(?:a\s+)?doen[çc]a|previne\s+doen[çc]a)\b/i, term:'cura/tratamento de doença'},
    {pattern:/\banti[\s\-]?inflam[áa]/i, term:'anti-inflamatório'},
    {pattern:/\bcicatrizante\b/i, term:'cicatrizante'},
    {pattern:/\bantibac/i, term:'antibacteriano'},
    {pattern:/\bantif[uú]ng/i, term:'antifúngico'},
    {pattern:/\bel[íi]mina\s+(?:rugas|cicatrizes|estrias)\b/i, term:'eliminar rugas/cicatrizes/estrias'},
    {pattern:/\bregenera\s+(?:c[ée]lula|tecido)/i, term:'regenera células/tecidos'},
  ];
  forbidden.forEach(f=>{
    if(f.pattern.test(allText)){
      issues.push({
        level:'crit', cat:'claims',
        title:`Termo proibido detectado: "${f.term}"`,
        desc:'Cosméticos não podem ter alegações terapêuticas, medicamentosas ou que prometam tratamento/cura de doenças. Use termos como "auxilia", "ajuda a melhorar a aparência de".',
        ref:'RDC 907/2024, Art. 11 (alegações proibidas)',
      });
    }
  });

  // --- 18. ENCAMINHAMENTO DE DESCARTE ---
  // Sugestão: Material reciclável OU "Jogue no lixo"
  if(!ss.materialReciclavel && !ss.jogueLixo){
    issues.push({
      level:'info', cat:'sustentabilidade',
      title:'Sugestão: orientação de descarte',
      desc:'Incluir o selo "Material Reciclável" (Möbius) ou "Jogue no Lixo" orienta o consumidor sobre o descarte correto da embalagem.',
      ref:'Política Nacional de Resíduos Sólidos — Lei 12.305/2010',
      action:{label:'Adicionar na etapa 5 (selos)', kind:'wizard', step:5}
    });
  }

  return issues;
}

function curEls(){
  const arr = E().faces[E().face];
  if(arr) return arr;
  // fallback: pega a primeira face disponível
  const firstId = Object.keys(E().faces)[0];
  if(firstId){ E().face = firstId; return E().faces[firstId]; }
  return [];
}
function elById(id){ return curEls().find(e=>e.id===id); }
function pxmm(){ return BASE_PX_PER_MM * E().zoom; }

/* ===== Seleção múltipla helpers ===== */
function selIds(){
  // Retorna array com todos os ids selecionados (sel + selSet)
  const ids = new Set();
  if(E().selSet) E().selSet.forEach(id => ids.add(id));
  else if(E().sel) ids.add(E().sel);
  return [...ids].filter(id => elById(id)); // só ids existentes
}
function selEls(){
  return selIds().map(id => elById(id)).filter(Boolean);
}
function isSelected(id){
  if(E().selSet) return E().selSet.has(id);
  return E().sel === id;
}
function edSelectSingle(id){
  // Limpa multi e seleciona um só
  E().sel = id;
  E().selSet = null;
}
function edSelectToggle(id){
  // Shift+clique: adiciona ou remove da seleção
  if(!E().selSet){
    E().selSet = new Set(E().sel ? [E().sel] : []);
  }
  if(E().selSet.has(id)){
    E().selSet.delete(id);
    // Atualiza sel para outro elemento ou null
    const remaining = [...E().selSet];
    E().sel = remaining.length ? remaining[remaining.length-1] : null;
  } else {
    E().selSet.add(id);
    E().sel = id;
  }
  // Se ficou só 1 ou 0, simplifica
  if(E().selSet.size <= 1){
    E().sel = E().selSet.size === 1 ? [...E().selSet][0] : null;
    E().selSet = null;
  }
}
function edSelectAll(){
  const all = curEls().filter(e => e.visible !== false);
  if(!all.length) return;
  E().selSet = new Set(all.map(e => e.id));
  E().sel = all[all.length-1].id;
  if(E().selSet.size === 1){
    E().sel = [...E().selSet][0];
    E().selSet = null;
  }
  edRender();
}
function edClearSelection(){
  E().sel = null;
  E().selSet = null;
}
/* Bounding box que envolve todos os elementos selecionados */
function getMultiBBox(){
  const els = selEls();
  if(!els.length) return null;
  // Para cada elemento, considera os 4 cantos rotacionados
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  els.forEach(el=>{
    const cx = el.x + el.w/2, cy = el.y + el.h/2;
    const corners = [
      [-el.w/2, -el.h/2], [el.w/2, -el.h/2],
      [el.w/2, el.h/2], [-el.w/2, el.h/2],
    ];
    corners.forEach(([dx,dy])=>{
      const r = rot2(dx, dy, el.rot);
      const x = cx + r.x, y = cy + r.y;
      if(x < minX) minX = x;
      if(x > maxX) maxX = x;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
    });
  });
  return { x:minX, y:minY, w:maxX-minX, h:maxY-minY };
}

/* ---------- Setup ---------- */
function buildEditor(){
  // toolbar de ferramentas
  const tools = [
    {id:'text',label:'Texto'},
    {id:'textCurve',label:'Texto em curva'},
    {id:'rect',label:'Caixa'},
    {id:'ellipse',label:'Elipse'},
    {id:'line',label:'Linha'},
    {id:'shapeGallery',label:'Formas'},
    {id:'image',label:'Imagem',sep:true},
    {id:'barcode',label:'Cód.Barras'},
    {id:'qr',label:'QR Code'},
  ];
  const tb = $('#edToolbar'); tb.innerHTML = '';
  tools.forEach(t=>{
    if(t.sep){ const s=document.createElement('div'); s.className='tsep'; tb.appendChild(s); }
    const b=document.createElement('button');
    b.className='ed-tool';
