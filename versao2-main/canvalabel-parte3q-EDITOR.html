<script>
'use strict';

/* ============================================================
   ESTADO GLOBAL
============================================================ */
const state = {
  produto: null,            // cosmetico | bebidas | ...
  conhece: null,            // sei | naosei
  frascoFoto: null,         // base64
  rotulo: {
    tipo: null,             // adesivo | sleeve | serigrafia | inmold
    config: null,           // ex: 'frente e verso'
    w: 70, h: 90,           // mm
    faca: null,             // dataURL do arquivo
    facaNome: null,         // nome original
    facaKind: null,         // 'image' | 'svg' | 'pdf' | 'ai' | 'eps'
    facaSize: null,         // tamanho legível ("142 KB")
  },
  verso: {
    nome: '', introducao: '', modoUso: '', dicas: '', precaucoes: '',
    ingEn: '', ingPt: '', qrLink: '',
    fabNome: '', fabCnpj: '', fabIe: '', fabEnd: '', fabCrq: '', fabAnvisa: '',
    fornNome: '', fornCnpj: '', fornEnd: '', fornIe: '',
    sac: '', codBarras: '', validadeLote: 'Validade e lote: vide embalagem',
  },
  selos: {
    vegano: false,
    materialReciclavel: false,
    jogueLixo: false,                         // selo "Jogue no Lixo"
    euReciclo: false,
    tipoMaterial: null,                       // PET, PEAD, PVC, PEBD, PP, PS, OUTROS
    validadeAbertura: null,                   // 1M..36M
    crueltyFree: false,                       // sub do "não testado"
    naoTestado: false,                        // sub do "não testado"
    outros: [],                               // base64[]
  },
  frente: {
    logo: null,             // base64
    logoNome: null,
    nome: '',
    oque: '',               // Shampoo, Condicionador, ...
    ativos: '',
    volume: '',
  },
  refs: [],                 // base64[]

  // Prompt + análise da IA
  ai: {
    prompt: '',              // descrição livre do que o usuário imagina
    extractedPalette: [],    // cores dominantes extraídas das referências
    analysis: null,          // análise visual completa { palette, warmth, contrast, saturation, density }
    briefingVector: null,    // vetor de estilo final (para debug)
    variations: [],          // 4 variações geradas (template+paleta)
    chosenVariation: 0,      // índice escolhido pelo usuário
  },

  // Conteúdo gerado pela IA — preenchido na etapa 'gerando'
  editor: {
    label: { w:70, h:90, bleed:3, safe:4, bg:'#ffffff' },
    faces: {},                  // { [faceId]: Element[] }
    faceConfig: null,           // resultado de getFaceConfig
    face: 'frente',             // faceId atual
    sel: null,
    selSet: null,             // Set<id> para seleção múltipla (null = só usa sel)
    zoom: 1.6,
    uid: 1,
    docname: 'Rótulo',
    templateId: null,           // template de design usado
    paletteOverride: null,      // paleta extraída/customizada que sobrescreve a do template
  },

  // Plano do usuário (afeta branding do PDF e features Pro)
  plan: 'free',                 // 'free' | 'pro'

  // Material de impressão escolhido pelo usuário (etapa 11)
  material: {
    family: null,    // 'bopp' | 'vinil' | 'couche' | 'gofrado'
    variant: null,   // família-dependente (ex: 'branco', 'metalizado', 'transparente')
    subvariant: null,// quando aplicável (ex: 'metal' ou 'holografico' para BOPP metalizado)
  },

  // Acabamentos por camada (etapa 12)
  // Mapa elementId -> {verniz, hotstamp, baixoRelevo}
  // hotstamp pode ser 'silver', 'gold', 'copper', 'holografico', ou null
  finishes: {},

  // Preview profissional do rótulo (modal acessado pelo botão "Preview" no editor)
  preview: {
    background: 'white',      // 'white' | 'light' | 'dark' | 'black'
    view: 'flat',             // 'flat' | 'curved' | 'both'
    showFinishes: true,       // se mostra os efeitos visuais dos acabamentos
  },
};

/* Snapshot dos defaults — clonado AGORA antes de qualquer mutação.
   Usado em resetStateToInitial pra "Novo projeto" / "Voltar pra home". */
const STATE_DEFAULTS = JSON.parse(JSON.stringify(state, (k,v)=>{
  if(v instanceof Set) return [...v];
  return v;
}));

/* Reseta state pros defaults (volta a um projeto novo, em branco). */
function resetStateToInitial(){
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, JSON.parse(JSON.stringify(STATE_DEFAULTS)));
  // Reset de variáveis auxiliares fora do state
  currentProjectId = null;
  isDirty = false;
  lastSaveTimestamp = null;
  // Reset do editor (faz com que ele seja reconstruído na próxima entrada)
  edReady = false;
  try { localStorage.removeItem(ACTIVE_KEY); } catch(e){}
}

/* ============================================================
   PERSISTÊNCIA — salvar/carregar projeto via localStorage
   Driver hoje: localStorage. Futuro: backend (apenas troca o driver).
   Política: 1 projeto ativo + lista de projetos salvos.
============================================================ */
const STORAGE_KEY = 'canvalabel.projects';   // lista de projetos
const ACTIVE_KEY  = 'canvalabel.active';      // id do projeto ativo
const THEME_KEY   = 'canvalabel.theme';       // 'light' | 'dark'
const AUTOSAVE_INTERVAL_MS = 30000;           // 30 segundos

// Estado de "dirty": se há mudanças não salvas desde o último save
let isDirty = false;
let currentProjectId = null;       // null = projeto novo (ainda não salvo)
let lastSaveTimestamp = null;       // pra mostrar "salvo há Xs"
let autosaveTimer = null;

/* Gera um id único pro projeto. */
/* ============================================================
   TEMA (modo claro / escuro)
   - Default: detecta preferência do sistema (prefers-color-scheme)
   - Override: usuário escolhe e fica salvo no localStorage
   - Aplica via classe `body.theme-light`. Sem classe = escuro (padrão)
============================================================ */

/* Detecta tema do sistema operacional na 1ª visita */
function getSystemTheme(){
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
    return 'light';
  }
  return 'dark';
}

/* Pega tema atual do storage ou detecta do sistema */
function getCurrentTheme(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if(saved === 'light' || saved === 'dark') return saved;
  } catch(e){}
  return getSystemTheme();
}

/* Aplica tema sem salvar (usado no boot) */
function applyTheme(theme){
  if(theme === 'light'){
    document.body.classList.add('theme-light');
  } else {
    document.body.classList.remove('theme-light');
  }
}

/* Alterna tema, salva preferência, mostra toast */
function toggleTheme(){
  const current = document.body.classList.contains('theme-light') ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  toast(next === 'light' ? 'Modo claro ativado' : 'Modo escuro ativado');
}

/* Aplica o tema imediatamente no carregamento, antes do app inicializar.
   Importante: roda síncrono pra evitar "flash" de tema errado. */
applyTheme(getCurrentTheme());

function genProjectId(){
  return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

/* Retorna a lista de projetos do localStorage. Sempre array. */
function loadProjectsList(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e){
    console.warn('Falha lendo projetos do localStorage', e);
    return [];
  }
}

/* Persiste a lista no localStorage. */
function saveProjectsList(arr){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    return true;
  } catch(e){
    // QuotaExceededError é o erro típico de localStorage cheio
    console.error('Falha ao salvar no localStorage', e);
    return false;
  }
}

/* Serializa o state atual em um objeto plano (Set vira Array, etc).
   O resultado é JSON-safe. */
function serializeState(){
  // Cria um clone raso e ajusta os pontos problemáticos
  const cloned = JSON.parse(JSON.stringify(state, (key, value)=>{
    // Sets não são JSON-serializable
    if(value instanceof Set) return [...value];
    return value;
  }));
  return cloned;
}

/* Restaura state a partir de um objeto serializado.
   Tem que ser cirúrgico: preserva referências do app (RENDER, etc) mas
   atualiza os campos de dados. */
function deserializeState(obj){
  if(!obj || typeof obj !== 'object') return;
  // Reseta tudo do state existente preservando referência do objeto
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, obj);
  // Restaura Sets (selSet) se necessário
  if(state.editor && state.editor.selSet && Array.isArray(state.editor.selSet)){
    state.editor.selSet = new Set(state.editor.selSet);
  }
  // Campos novos que projetos antigos podem não ter
  if(!state.material) state.material = {family:null, variant:null, subvariant:null};
  if(!state.finishes) state.finishes = {};
  if(!state.preview) state.preview = {background:'white', view:'flat', showFinishes:true};
  // Migração: valores antigos ('studio', 'gold', 'tilted') viram defaults novos
  if(state.preview.background === 'studio' || state.preview.background === 'gold') state.preview.background = 'white';
  if(state.preview.view === 'tilted') state.preview.view = 'curved';
  if(!state.plan) state.plan = 'free';
}

/* Salva o projeto. Se currentProjectId é null, cria um novo.
   Retorna {ok, id, name}. */
function saveProject(opts){
  opts = opts || {};
  const list = loadProjectsList();
  const now = Date.now();
  const data = serializeState();

  // Nome padrão: usa o nome do documento no editor, ou produto + data
  let name = opts.name || (state.editor && state.editor.docname) || 'Rótulo sem nome';
  if(name === 'Rótulo' && state.frente && state.frente.nome){
    name = state.frente.nome;
  }

  let id = currentProjectId;
  let existing = id ? list.find(p => p.id === id) : null;

  if(existing){
    existing.name = name;
    existing.updatedAt = now;
    existing.data = data;
  } else {
    id = genProjectId();
    list.unshift({
      id, name,
      createdAt: now,
      updatedAt: now,
      data,
    });
    currentProjectId = id;
  }

  const ok = saveProjectsList(list);
  if(ok){
    try { localStorage.setItem(ACTIVE_KEY, id); } catch(e){}
    isDirty = false;
    lastSaveTimestamp = now;
    updateSaveIndicator();
  }
  return { ok, id, name };
}

/* Carrega um projeto pelo id. Retorna true/false. */
function loadProject(id){
  const list = loadProjectsList();
  const p = list.find(x => x.id === id);
  if(!p) return false;
  try {
    deserializeState(p.data);
    currentProjectId = p.id;
    isDirty = false;
    lastSaveTimestamp = p.updatedAt;
    try { localStorage.setItem(ACTIVE_KEY, id); } catch(e){}
    return true;
  } catch(e){
    console.error('Falha carregando projeto', e);
    return false;
  }
}

/* Apaga um projeto. */
function deleteProject(id){
  const list = loadProjectsList().filter(p => p.id !== id);
  saveProjectsList(list);
  if(currentProjectId === id){
    currentProjectId = null;
    try { localStorage.removeItem(ACTIVE_KEY); } catch(e){}
  }
}

/* Marca que houve mudança não salva e agenda auto-save. */
function markDirty(){
  if(!isDirty){
    isDirty = true;
    updateSaveIndicator();
  }
  // Reagenda o autosave (debounce básico)
  if(autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    if(isDirty) saveProject();
  }, AUTOSAVE_INTERVAL_MS);
}

/* Atualiza o badge "Salvo / Salvando / Não salvo" no header do editor. */
function updateSaveIndicator(){
  const ind = document.getElementById('saveIndicator');
  if(!ind) return;
  if(isDirty){
    ind.textContent = 'Não salvo';
    ind.className = 'save-ind dirty';
  } else if(lastSaveTimestamp){
    const secs = Math.floor((Date.now() - lastSaveTimestamp) / 1000);
    if(secs < 5){
      ind.textContent = 'Salvo';
      ind.className = 'save-ind saved';
    } else if(secs < 60){
      ind.textContent = `Salvo há ${secs}s`;
      ind.className = 'save-ind saved';
    } else {
      const mins = Math.floor(secs / 60);
      ind.textContent = `Salvo há ${mins}min`;
      ind.className = 'save-ind saved';
    }
  } else {
    ind.textContent = 'Projeto novo';
    ind.className = 'save-ind';
  }
}

// Atualiza o indicador a cada 10s pra mostrar tempo decorrido
setInterval(()=>{ if(!isDirty) updateSaveIndicator(); }, 10000);

window.addEventListener('beforeunload', (ev)=>{

/* Formata um timestamp em texto relativo: "agora", "5 min atrás", "ontem" */
function fmtRelativeTime(ts){
  if(!ts) return '';
  const now = Date.now();
  const diff = now - ts;
  const sec = Math.floor(diff / 1000);
  if(sec < 30) return 'agora mesmo';
  if(sec < 60) return `${sec}s atrás`;
  const min = Math.floor(sec / 60);
  if(min < 60) return `${min} min atrás`;
  const hr = Math.floor(min / 60);
  if(hr < 24) return `${hr}h atrás`;
  const days = Math.floor(hr / 24);
  if(days === 1) return 'ontem';
  if(days < 7) return `${days} dias atrás`;
  const wks = Math.floor(days / 7);
  if(wks < 4) return `${wks} sem atrás`;
  // Mais de um mês: mostra data
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear().toString().slice(2)}`;
}

/* ============================================================
   STEPS
============================================================ */
const STEPS = [
  {id:'produto',  label:'Produto'},
  {id:'rotulo',   label:'Rótulo'},
  {id:'verso',    label:'Verso'},
  {id:'selos',    label:'Selos'},
  {id:'frente',   label:'Frente'},
  {id:'refs',     label:'Referências'},
  {id:'resumo',   label:'Revisão'},
  {id:'gerando',  label:'Gerando'},
  {id:'variacoes',label:'Escolher'},
  {id:'editor',   label:'Editor'},
  {id:'material', label:'Material'},
  {id:'acabamentos', label:'Acabamentos'},
  {id:'exportar', label:'Exportar'},
];

/* Grupos visuais do stepper: agrupa as 13 etapas em 5 fases lógicas.
   Cada grupo mostra:
   - Número (1-5)
   - Label da fase
   - Subtítulo dinâmico com a etapa interna atual (ex: "2 de 3")

   Isso encurta o stepper em telas estreitas e dá uma estrutura
   mental clara pro usuário: "estou na fase de Conteúdo".
*/
const STEP_GROUPS = [
  { id:'briefing',  label:'Briefing',   sub:'Produto e formato',     stepIds:['produto','rotulo','verso'] },
  { id:'conteudo',  label:'Conteúdo',   sub:'Informações do rótulo', stepIds:['selos','frente','refs'] },
  { id:'geracao',   label:'Geração',    sub:'IA cria seu rótulo',    stepIds:['resumo','gerando','variacoes'] },
  { id:'edicao',    label:'Edição',     sub:'Ajustes finais',        stepIds:['editor'] },
  { id:'producao',  label:'Produção',   sub:'Material e exportação', stepIds:['material','acabamentos','exportar'] },
];

/* Helper: dado um índice de step, retorna o grupo que ele pertence */
function groupForStep(stepIdx){
  const stepId = STEPS[stepIdx] && STEPS[stepIdx].id;
  return STEP_GROUPS.findIndex(g => g.stepIds.includes(stepId));
}
/* Helper: índice da etapa atual dentro do grupo (0-based) */
function stepIdxInGroup(stepIdx){
  const stepId = STEPS[stepIdx].id;
  const gi = groupForStep(stepIdx);
  if(gi < 0) return 0;
  return STEP_GROUPS[gi].stepIds.indexOf(stepId);
}
let cur = 0;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- toast ---------- */
let toastT;

/* ---------- upload helpers ---------- */
// Detecta tipo de arquivo a partir do nome/MIME
function detectFileKind(file){
  const name = (file.name||'').toLowerCase();
  const mime = (file.type||'').toLowerCase();
  if(mime.startsWith('image/svg') || name.endsWith('.svg'))     return 'svg';
  if(mime === 'application/pdf' || name.endsWith('.pdf'))       return 'pdf';
  if(name.endsWith('.ai'))                                      return 'ai';
  if(name.endsWith('.eps') || mime === 'application/postscript')return 'eps';
  if(mime.startsWith('image/'))                                 return 'image';
  return 'other';
}
function humanSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// pickFile(cb, accept?) — cb recebe (dataUrl, name, meta)
//   meta = { kind, mime, size, sizeHuman }
function pickFile(cb, accept){
  const inp = $('#fileInput');
  // Aplica o accept dinamicamente (default = imagens + arquivos técnicos)
  inp.accept = accept || 'image/*,.pdf,.svg,.ai,.eps';
  inp.value = '';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const kind = detectFileKind(f);
    const meta = { kind, mime:f.type, size:f.size, sizeHuman:humanSize(f.size) };
    const r = new FileReader();
    r.onload = ()=>cb(r.result, f.name, meta);
    r.readAsDataURL(f);
  };
  inp.click();
}
function pickFiles(cb, accept){
  const inp = $('#fileInputMulti');
  inp.accept = accept || 'image/*';
  inp.value = '';
  inp.onchange = e => {
    const files = [...e.target.files]; if(!files.length) return;
    const reads = files.map(f => new Promise(res=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.readAsDataURL(f);
    }));
    Promise.all(reads).then(cb);
  };
  inp.click();
}

/* ============================================================
   STEPPER + NAV
============================================================ */
function renderStepper(){
  const sp = $('#stepper'); sp.innerHTML = '';
  const curGroup = groupForStep(cur);

  STEP_GROUPS.forEach((g, gi) => {
    if(gi > 0){
      const d = document.createElement('div'); d.className = 'stp-sep'; sp.appendChild(d);
    }
    const el = document.createElement('div');
    const isDone = gi < curGroup;
    const isActive = gi === curGroup;
    el.className = 'stp stp-group' +
      (isDone ? ' done' : '') +
      (isActive ? ' active' : '') +
      (isDone || isActive ? ' clickable' : '');

    // Mostra "2 de 3" quando ativo (qual etapa interna do grupo está rolando)
    let subText = g.sub;
    if(isActive && g.stepIds.length > 1){
      const inGroupIdx = stepIdxInGroup(cur);
      subText = `${inGroupIdx + 1} de ${g.stepIds.length}`;
    } else if(isActive && g.stepIds.length === 1){
      subText = '';
    }

    el.innerHTML = `
      <span class="num">${isDone ?
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px"><path d="M20 6L9 17l-5-5"/></svg>'
        : (gi + 1)}</span>
      <span class="stp-text">
        <span class="lbl">${g.label}</span>
        ${subText ? `<span class="lbl-sub">${subText}</span>` : ''}
      </span>`;

    // Click: vai pra primeira etapa do grupo (se já passou ou é o atual)
    if(isDone || (isActive && stepIdxInGroup(cur) > 0)){
      el.onclick = () => {
        const firstStepInGroup = stepIdx(g.stepIds[0]);
        if(firstStepInGroup >= 0) go(firstStepInGroup);
      };
    }
    sp.appendChild(el);
  });
}

function go(i){
  if(i<0||i>=STEPS.length) return;

  // Proteção: se o usuário já tem editor com elementos e clicou pra ir pra
  // 'gerando' (regerar com IA destruiria o trabalho), confirma e pula direto pro editor.
  const targetId = STEPS[i].id;
  const editorAlreadyExists = edReady && Object.values(state.editor.faces || {}).some(face=>face.length>0);
  if(editorAlreadyExists && (targetId === 'gerando' || targetId === 'variacoes')){
    // Pula direto pro editor sem confirmar — o usuário queria avançar, não regerar
    toast('Voltando ao editor (suas alterações foram preservadas)');
    return go(stepIdx('editor'));
  }

  cur = i;
  const id = STEPS[i].id;

  // alterna modo: editor ocupa a tela toda
  if(id==='editor'){
    document.body.classList.add('editor-mode');
    if(!edReady){ buildEditor(); edReady=true; }
    edEnter();
    renderStepper();
    const gi = groupForStep(i);
    const groupLabel = gi >= 0 ? STEP_GROUPS[gi].label : '';
    $('#footMeta').textContent = `Fase ${gi+1} de ${STEP_GROUPS.length} · ${groupLabel} · CanvaLabel`;
    return;
  } else {
    document.body.classList.remove('editor-mode');
  }

  renderStepper();
  RENDER[id]();
  $('#body').scrollTop = 0;
  renderFoot();
  const gi = groupForStep(i);
  const groupLabel = gi >= 0 ? STEP_GROUPS[gi].label : '';
  const stepLabel = STEPS[i].label;
  const inGroup = stepIdxInGroup(i);
  const groupTotal = gi >= 0 ? STEP_GROUPS[gi].stepIds.length : 1;
  const subtitle = groupTotal > 1 ? `${stepLabel} · ${inGroup+1}/${groupTotal}` : stepLabel;
  $('#footMeta').textContent = `Fase ${gi+1} · ${groupLabel} · ${subtitle} · CanvaLabel`;
}

function renderFoot(){
  const id = STEPS[cur].id;

  // Etapas que têm navegação própria (botões dentro da tela via step-nav)
  // não devem mostrar o footer fixo padrão. Senão ficam dois jogos de botões.
  if(id==='gerando' || id==='material' || id==='acabamentos' || id==='exportar'){
    $('#foot').innerHTML = '';
    return;
  }

  const v = validate(id);
  const canBack = cur>0;
  // Detecta se o usuário já passou pela geração (já tem editor montado com elementos).
  // Se sim, voltar pro editor não deve re-rodar a IA — preserva o trabalho.
  const editorAlreadyExists = edReady && Object.values(state.editor.faces || {}).some(face=>face.length>0);

  let nextLabel = 'Continuar';
  let nextIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
  let nextAction = ()=>{
    const v2 = validate(id);
    if(!v2.ok){ toast(v2.msg); return; }
    go(cur+1);
  };

  if(id==='resumo'){
    if(editorAlreadyExists){
      // Já tem rótulo gerado — não regenera, só volta ao editor
      nextLabel = 'Voltar ao editor (sem regenerar)';
      nextIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
      nextAction = ()=>go(stepIdx('editor'));
    } else {
      nextLabel = 'Gerar rótulo com IA';
      nextIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2L12 8l6.5.5-5 4 1.5 6.5L9.5 15 4 19l1.5-6.5-5-4L7 8z"/></svg>';
    }
  }

  // Aviso visual no header da etapa quando o usuário voltou de um rótulo já gerado
  let banner = '';
  if(editorAlreadyExists && ['produto','rotulo','verso','selos','frente','refs','resumo'].includes(id)){
    banner = `<div class="edit-banner">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h0"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Você já gerou o rótulo. As alterações aqui <b>não regeneram</b> automaticamente — para aplicar mudanças no design, volte ao editor.</span>
      <button class="edit-banner-go" id="ebGo">Voltar ao editor</button>
    </div>`;
  }

  $('#foot').innerHTML = `
    ${banner}
    <div class="foot-buttons">
      <button class="btn btn-ghost" id="bBack" ${canBack?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar
      </button>
      <button class="btn btn-primary" id="bNext" ${v.ok?'':'disabled'}>
        ${nextLabel}${nextIco}
      </button>
    </div>`;
  $('#bBack').onclick = ()=>{
    // Não permite voltar via "Voltar" se a etapa anterior é 'gerando' (pula ela)
    let prev = cur - 1;
    if(prev >= 0 && STEPS[prev].id === 'gerando') prev--;
    if(prev >= 0 && STEPS[prev].id === 'variacoes') prev--;
    go(prev);
  };
  $('#bNext').onclick = nextAction;
  const eb = $('#ebGo');
  if(eb) eb.onclick = ()=>go(stepIdx('editor'));
}

/* ============================================================
   VALIDAÇÃO POR ETAPA
============================================================ */
function validate(id){
  if(id==='produto'){
    if(!state.produto) return {ok:false,msg:'Selecione o tipo de produto'};
    if(state.produto==='cosmetico' && !state.conhece)
      return {ok:false,msg:'Indique se você já sabe seu rótulo'};
    if(state.conhece==='naosei' && !state.frascoFoto)
      return {ok:false,msg:'Envie a foto do frasco para identificação'};
    return {ok:true};
  }
  if(id==='rotulo'){
    if(!state.rotulo.tipo) return {ok:false,msg:'Escolha o tipo de rótulo'};
    if(!state.rotulo.config && hasConfigs(state.rotulo.tipo))
      return {ok:false,msg:'Escolha a configuração do rótulo'};
    if(state.rotulo.tipo!=='inmold'){
      if(!state.rotulo.w || !state.rotulo.h)
        return {ok:false,msg:'Informe largura e altura do rótulo'};
    } else {
      if(!state.rotulo.faca)
        return {ok:false,msg:'Anexe a faca/molde da área de impressão (In Mold)'};
    }
    return {ok:true};
  }
  if(id==='frente'){
    if(!state.frente.nome.trim()) return {ok:false,msg:'Informe o nome do produto'};
    return {ok:true};
  }
  return {ok:true};
}
function hasConfigs(tipo){ return ['adesivo','serigrafia'].includes(tipo); }

/* Retorna o caminho legível do material escolhido. */
function getMaterialLabel(m){
  if(!m || !m.family) return '—';
  const fam = MATERIAIS_TREE[m.family];
  if(!fam) return '—';
  let label = fam.name;
  if(m.variant){
    const v = fam.variants[m.variant];
    if(v){
      label += ' / ' + v.name;
      if(m.subvariant && v.subvariants){
        const sv = v.subvariants[m.subvariant];
        if(sv) label += ' / ' + sv.name;
      }
    }
  }
  return label;
}

/* Verifica se a seleção do material está completa (chegou na folha da árvore). */
function isMaterialComplete(m){
  if(!m || !m.family) return false;
  const fam = MATERIAIS_TREE[m.family];
  if(!fam) return false;
  if(!m.variant) return false;
  const v = fam.variants[m.variant];
  if(!v) return false;
  if(v.subvariants && !m.subvariant) return false;
  return true;
}

/* Quais acabamentos estão disponíveis dado o material escolhido.
   Couché fosco, por exemplo, não combina com hot stamping (a textura
   rugosa do papel atrapalha). Couché brilho ok.
   Por ora: todos os acabamentos disponíveis em todos os materiais,
   exceto algumas combinações conhecidas. */
function getAvailableFinishes(m){
  const avail = { verniz:true, hotstamp:true, baixoRelevo:true };
  if(!m || !m.family){
    // Sem material escolhido ainda: assume tudo disponível
    return avail;
  }
  if(m.family === 'gofrado'){
    // Gofrado já tem textura — verniz e baixo relevo podem conflitar
    avail.verniz = false;
    avail.baixoRelevo = false;
  }
  if(m.family === 'bopp' && m.variant === 'metalizado'){
    // Já é metalizado — hot stamping fica redundante e caro
    avail.hotstamp = false;
  }
  return avail;
}

/* Retorna os acabamentos do elemento (ou objeto vazio se não tem). */
function getElFinishes(el){
  if(!el || !el.id) return {};
  return state.finishes[el.id] || {};
}

/* Seta um acabamento de um elemento. */
function setElFinish(el, key, value){
  if(!el || !el.id) return;
  if(!state.finishes[el.id]) state.finishes[el.id] = {};
  if(value === null || value === false || value === undefined){
    delete state.finishes[el.id][key];
    // Se ficou vazio, limpa o objeto inteiro
    if(Object.keys(state.finishes[el.id]).length === 0){
      delete state.finishes[el.id];
    }
  } else {
    state.finishes[el.id][key] = value;
  }
}

/* Verifica se um elemento tem ao menos um acabamento. */
function elHasAnyFinish(el){
  const f = getElFinishes(el);
  return !!(f.verniz || f.hotstamp || f.baixoRelevo);
}

function renderRotCfg(){

        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="${badgeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <div style="font-size:8px;font-weight:800;color:${badgeColor};letter-spacing:.05em">${kind.toUpperCase()}</div>
      </div>`;
    }
    html += `<div style="display:flex;gap:12px;align-items:center;background:var(--panel);
      border:1px solid var(--line);border-radius:10px;padding:12px 14px">
      ${preview}

        <div style="font-size:13px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${state.rotulo.facaNome||'arquivo'}</div>
        <div style="font-size:10.5px;color:var(--ink-faint);font-weight:600">
          ${kindLabel}${state.rotulo.facaSize?' · '+state.rotulo.facaSize:''}
        </div>
      </div>
      <button id="rmFaca" style="background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:11px;font-weight:700;color:var(--ink-dim);display:flex;align-items:center;gap:5px">

      </button></div>`;
  } else {
    html += `<div class="drop" id="dropFaca" style="padding:22px">
      <div class="dico" style="width:38px;height:38px;margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </div>
      <b>Anexar arquivo da faca/molde</b>
      <span>PDF, SVG, AI, EPS ou imagem ${facaRequired?'· obrigatório para In Mold':'· opcional'}</span>
    </div>`;
  }
  html += `</div>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <p>${facaRequired
        ? 'No In Mold, a faca define a área de impressão — por isso ela é obrigatória nesta etapa.'
        : 'O tamanho informado define a área editável no editor. A faca/molde é usada pela gráfica para o recorte final.'}</p></div>
  </div>`;
  $('#rotCfg').innerHTML = html;

  $$('.opt[data-cfg]').forEach(o=>{
    o.onclick = ()=>{ state.rotulo.config = o.dataset.cfg; renderRotCfg(); renderFoot(); };
  });
  if($('#rotW')) $('#rotW').oninput = e => { state.rotulo.w = parseFloat(e.target.value)||0; renderFoot(); };
  if($('#rotH')) $('#rotH').oninput = e => { state.rotulo.h = parseFloat(e.target.value)||0; renderFoot(); };
  if($('#dropFaca')) $('#dropFaca').onclick = ()=>pickFile(
    (data, name, meta)=>{
      state.rotulo.faca = data;
      state.rotulo.facaNome = name;
      state.rotulo.facaKind = meta.kind;
      state.rotulo.facaSize = meta.sizeHuman;
      renderRotCfg(); renderFoot();
      toast('Arquivo da faca anexado: '+name);
    },
    'image/*,.pdf,.svg,.ai,.eps,application/pdf,application/postscript,image/svg+xml'
  );
  if($('#rmFaca')) $('#rmFaca').onclick = ()=>{
    state.rotulo.faca=null; state.rotulo.facaNome=null;
    state.rotulo.facaKind=null; state.rotulo.facaSize=null;
    renderRotCfg(); renderFoot();
  };
}

    <div class="section-h">Selos do produto</div>
    <div class="chips">
      ${seloChip('vegano','Vegano','V')}

      ${seloChip('euReciclo','eureciclo','e')}

      ${seloChip('crueltyFree','Cruelty Free','🐰')}

    </div>

    <div class="section-h">Tipo de material (código de reciclagem)</div>
    <p class="scr-sub" style="margin-bottom:14px;font-size:12.5px">Indique o material da sua embalagem — o ícone correspondente entra no rótulo.</p>
    <div class="chips">
      ${MATERIAIS_RECICLAGEM.map(m=>{
        const on = s.tipoMaterial === m.code;
        // Para códigos 1-7 mostra o número; para PAP/ALU/GLS mostra o código completo (mais legível)
        const isNumeric = /^[1-7]$/.test(m.code);
        return `<button class="chip compact ${on?'sel':''}" data-mat="${m.code}" title="${m.desc||''}">
          <span class="cdot${isNumeric?'':' wide'}">${m.code}</span>${m.name}

    <div class="chips">
      ${VALIDADES.map(v=>{
        const on = s.validadeAbertura === v;
        return `<button class="chip compact ${on?'sel':''}" data-val="${v}">
          <span class="cdot">⌛</span>${v}
        </button>`;
      }).join('')}
    </div>

    <div class="section-h">Outros selos / certificações próprias</div>
    <div class="fld">
      ${s.outros.length?`<div class="thumbs">${s.outros.map((src,i)=>`
        <div class="thumb" style="background-image:url(${src})">
          <button class="rm" data-rmselo="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`).join('')}</div>`:''}
      <div class="drop" id="dropSelos" style="padding:20px;margin-top:${s.outros.length?'12px':'0'}">
        <div class="dico" style="width:38px;height:38px;margin-bottom:8px">

        </div>

        <span>PNG ou SVG vetorial — pode anexar vários</span>
      </div>
    </div>

    <div class="note teal" style="margin-top:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
    <p>Todas as escolhas aqui são opcionais. Pode pular esta etapa se preferir adicionar os selos manualmente depois no editor.</p></div>
  </div>`;
  $('#screen').innerHTML = html;

  $$('[data-selo]').forEach(b=>b.onclick = ()=>{
    const k = b.dataset.selo; s[k] = !s[k]; RENDER.selos();
  });
  $$('[data-mat]').forEach(b=>b.onclick = ()=>{
    s.tipoMaterial = s.tipoMaterial===b.dataset.mat ? null : b.dataset.mat; RENDER.selos();
  });
  $$('[data-val]').forEach(b=>b.onclick = ()=>{
    s.validadeAbertura = s.validadeAbertura===b.dataset.val ? null : b.dataset.val; RENDER.selos();
  });
  $$('[data-rmselo]').forEach(b=>b.onclick = ()=>{
    s.outros.splice(+b.dataset.rmselo,1); RENDER.selos();
  });
  $('#dropSelos').onclick = ()=>pickFiles(arr=>{ s.outros.push(...arr); RENDER.selos(); });
};

      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2L12 8l6.5.5-5 4 1.5 6.5L9.5 15 4 19l1.5-6.5-5-4L7 8z"/></svg>

      <div class="prompt-chips">

    <div class="section-h">Imagens de referência</div>

    <div class="fld">
      ${state.refs.length?`<div class="thumbs">${state.refs.map((r,i)=>`
        <div class="thumb lg" style="background-image:url(${r})">
          <button class="rm" data-rmref="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`).join('')}</div>`:''}
      <div class="drop" id="dropRefs" style="margin-top:${state.refs.length?'14px':'0'};padding:38px">
        <div class="dico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div>
        <b>Arraste ou clique para anexar referências</b>
        <span>JPG ou PNG · quantas quiser · totalmente opcional</span>
      </div>

      ${state.ai.analysis ? renderAnalysisCard(state.ai.analysis, state.ai.prompt) : ''}
    </div>

    <div class="note" style="margin-top:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>

    state.refs.splice(+b.dataset.rmref,1);

    state.ai.extractedPalette = state.ai.analysis ? state.ai.analysis.palette : [];
    RENDER.refs();
  });
  const reExtract = $('#reExtract');
  if(reExtract) reExtract.onclick = async ()=>{
    reExtract.textContent = '↻ Analisando…';
    state.ai.analysis = await analyzeReferences(state.refs);
    state.ai.extractedPalette = state.ai.analysis.palette;
    RENDER.refs();
    toast('Análise atualizada');
  };
};

/* Card de análise visual + briefing detectado */
function renderAnalysisCard(a, prompt){
  const promptParsed = parsePrompt(prompt || '');
  const briefingVec = mergeVectors(promptParsed.vec, visualAnalysisToVector(a), 2, 1);

  // Mostra os 4 eixos mais "fortes" (mais distantes de 0.5)
  const ranked = STYLE_AXES
    .map(ax => ({ axis: ax, val: briefingVec[ax], dist: Math.abs(briefingVec[ax]-0.5) }))
    .sort((a,b) => b.dist - a.dist).slice(0,5);

  const axisLabel = (ax, val) => {
    const map = {
      formal:[val<0.5?'casual':'formal',val<0.5?'1-val':'val'],
      denso:[val<0.5?'arejado':'denso'],
      quente:[val<0.5?'frio':'quente'],
      retro:[val<0.5?'moderno':'vintage'],
      ornamental:[val<0.5?'minimalista':'ornamentado'],
      feminino:[val<0.5?'neutro':'feminino'],
      luxo:[val<0.5?'popular':'premium'],
      vibrante:[val<0.5?'sóbrio':'vibrante'],
      natural:[val<0.5?'industrial':'natural'],
      sofisticado:[val<0.5?'despojado':'sofisticado'],
    };
    return (map[ax]||[ax])[0];
  };

  return `<div class="analysis-card" id="analysisCard">
    <div class="ac-head">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M3.51 9l5.19 3M15.31 12l5.19 3M3.51 15l5.19-3M15.31 12l5.19-3"/></svg>
      <span>O que a IA captou</span>
    </div>
    <div class="ac-grid">
      <div class="ac-block">
        <div class="ac-label">Paleta dominante</div>
        <div class="ac-swatches">${a.palette.map(c=>`<div class="ac-sw" style="background:${c}" title="${c.toUpperCase()}"></div>`).join('')}</div>
      </div>
      <div class="ac-block">
        <div class="ac-label">Atmosfera detectada</div>
        <div class="ac-meter"><div class="ac-meter-fill" style="left:${(1-a.warmth)*100}%;width:${Math.abs(a.warmth-0.5)*100}%"></div></div>
        <div class="ac-meter-labels"><span>frio</span><span>quente</span></div>
      </div>
      <div class="ac-block">
        <div class="ac-label">Saturação</div>
        <div class="ac-meter"><div class="ac-meter-fill" style="left:50%;width:${(a.saturation-0.5)*100}%"></div></div>
        <div class="ac-meter-labels"><span>muted</span><span>vibrante</span></div>
      </div>
      <div class="ac-block">
        <div class="ac-label">Densidade visual</div>
        <div class="ac-meter"><div class="ac-meter-fill" style="left:50%;width:${(a.density-0.5)*100}%"></div></div>
        <div class="ac-meter-labels"><span>arejado</span><span>denso</span></div>
      </div>
    </div>
    ${ranked.length ? `
      <div class="ac-tags">
        <span class="ac-tags-label">Briefing entendido:</span>
        ${ranked.map(r => `<span class="ac-tag" data-strength="${r.dist > 0.2 ? 'strong' : 'soft'}">${axisLabel(r.axis, r.val)}</span>`).join('')}
        <button class="pe-action" id="reExtract" style="margin-left:auto">↻ Recalcular</button>
      </div>
    ` : `<div style="text-align:right;padding:8px 14px 12px"><button class="pe-action" id="reExtract">↻ Recalcular</button></div>`}
  </div>`;
}

/* Atualização leve do card quando só o prompt muda — sem re-render geral */

/* ============================================================
   VETOR DE ESTILO — base do novo sistema de IA
   Cada dimensão vai de 0 a 1. Templates têm um vetor "ideal",
   prompts e referências contribuem para o vetor do briefing,
   e escolhemos o template com menor distância no vetor.
============================================================ */
const STYLE_AXES = [
  'formal',     // 0=casual, 1=formal/sério
  'denso',      // 0=arejado, 1=denso/cheio
  'quente',     // 0=frio, 1=quente
  'retro',      // 0=moderno, 1=retrô/vintage
  'ornamental', // 0=minimalista, 1=ornamentado
  'feminino',   // 0=neutro/masculino, 1=feminino
  'luxo',       // 0=popular, 1=premium/luxo
  'vibrante',   // 0=muted, 1=vibrante/saturado
  'natural',    // 0=industrial/tech, 1=natural/orgânico
  'sofisticado',// 0=despojado, 1=sofisticado/refinado
];

function makeVector(){
  const v = {}; STYLE_AXES.forEach(a => v[a] = 0.5); return v;
}

/* Aplica um delta a um eixo, com peso e clamp em [0,1] */
function adjustAxis(vec, axis, delta, weight){
  if(!(axis in vec)) return;
  weight = weight || 1;
  vec[axis] = Math.max(0, Math.min(1, vec[axis] + delta * weight));
}

/* Modificadores que ampliam ou invertem o efeito da próxima palavra */
const INTENSIFIERS = {
  'muito':1.5, 'bem':1.3, 'super':1.5, 'extremamente':1.7, 'bastante':1.3,
  'mais':1.2, 'altamente':1.4,
};
const DIMINISHERS = {
  'pouco':0.5, 'levemente':0.5, 'sutilmente':0.5, 'meio':0.6, 'um pouco':0.5,
  'leve':0.6, 'discreto':0.6, 'menos':0.7,
};
const NEGATORS = ['não','nao','sem','nada','nem','exceto'];

/* Cores nomeadas → hex aproximado */
const COLOR_NAMES = {
  'verde':'#3e6b4a','verde-musgo':'#4a5d3e','verde-escuro':'#1f3a2a','verde-água':'#7fb89c',
  'azul':'#3b5a7a','azul-marinho':'#1f3a5a','azul-claro':'#88b3d1','navy':'#1f3a5a',
  'rosa':'#d68aa4','rosê':'#d68aa4','rose':'#d68aa4','rosa-claro':'#f2c4d4',
  'vermelho':'#a8442e','bordô':'#6f2e2a','bordo':'#6f2e2a','vinho':'#5a2624',
  'amarelo':'#d8b34c','mostarda':'#b08a2e','dourado':'#b0883f','ouro':'#b0883f',
  'marrom':'#5e3f2a','caramelo':'#a8723d','café':'#3a261a','cafe':'#3a261a','chocolate':'#3a261a',
  'preto':'#1a1a1a','branco':'#fafafa','off-white':'#f0ebe0','cinza':'#7a7a7a','grafite':'#3a3a3a',
  'bege':'#e8d8b8','creme':'#f0e8d4','marfim':'#f4ead4','terracota':'#b25c34',
  'lilás':'#a78bbf','lilas':'#a78bbf','roxo':'#5a3a7a','violeta':'#7a4f9e',
  'turquesa':'#3aa0a0','menta':'#a8d0b8','salmão':'#e6a48a','salmao':'#e6a48a',
  'azeitona':'#6b7338','oliva':'#6b7338','mostarda':'#b08a2e',
};

/* ============================================================
   PARSE DO PROMPT — gera vetor + cores extraídas
============================================================ */
function parsePrompt(text){
  const vec = makeVector();
  const colors = [];
  const matches = [];                                 // [{kw, axis, delta}]

  if(!text || !text.trim()) return { vec, colors, matches };

  // normaliza: minúsculas, sem múltiplos espaços
  const t = ' ' + text.toLowerCase().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ') + ' ';

  // Tokeniza para detectar modificadores
  const words = t.trim().split(' ');

  // Faz o match por keyword. Para cada match, verifica modificadores
  // próximos (palavra anterior) e aplica delta proporcional.
  STYLE_KEYWORDS.forEach(rule => {
    rule.kws.forEach(kw => {
      // Procura todas as ocorrências (não só a primeira)
      let idx = -1;
      const search = ' ' + kw + ' ';
      while((idx = t.indexOf(search, idx+1)) !== -1){
        // calcula posição no array de palavras
        const before = t.slice(0, idx).trim().split(' ');
        const prev = before[before.length-1] || '';
        const prev2 = before[before.length-2] || '';

        let weight = 1;
        let sign = 1;

        // intensificador / diminuidor
        if(INTENSIFIERS[prev]) weight = INTENSIFIERS[prev];
        else if(DIMINISHERS[prev]) weight = DIMINISHERS[prev];
        else if(INTENSIFIERS[prev2+' '+prev]) weight = INTENSIFIERS[prev2+' '+prev];

        // negação
        if(NEGATORS.includes(prev) || NEGATORS.includes(prev2)) sign = -1;

        rule.effects.forEach(([axis, delta]) => {
          const actual = delta * sign * weight;
          adjustAxis(vec, axis, actual, 1);
          matches.push({ kw, axis, delta: actual });
        });
      }
    });
  });

  // Cores nomeadas — adiciona à lista (sem duplicar)
  Object.entries(COLOR_NAMES).forEach(([name, hex])=>{
    if(t.includes(' '+name+' ') && !colors.includes(hex)){
      colors.push(hex);
    }
  });

  return { vec, colors, matches };
}

/* ============================================================
   ANÁLISE VISUAL DAS REFERÊNCIAS
   Além da paleta, extrai:
   - temperatura (quente/fria)
   - contraste (alto/baixo)
   - saturação média (vibrante/muted)
   - densidade visual (cheio/vazio) — proxy via entropia/variância
   Tudo isso é fundido no vetor de estilo do briefing.
============================================================ */
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  const l = (mx+mn)/2;
  let h, s;
  if(mx===mn){ h=0; s=0; }
  else {
    const d = mx-mn;
    s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
    switch(mx){
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      case b: h = (r-g)/d + 4; break;
    }
    h /= 6;
  }
  return [h*360, s, l];
}

function isWarmHue(h){
  // 0-60 (vermelho/laranja/amarelo) e 320-360 (rosa/magenta) = quente
  // 60-260 (verde/azul/roxo) = frio
  return (h <= 70) || (h >= 320);
}

async function analyzeReferences(srcs){
  if(!srcs || !srcs.length){
    return { palette:[], warmth:0.5, contrast:0.5, saturation:0.5, density:0.5 };
  }

  const buckets = new Map();
  let pxCount = 0;
  let sumSat = 0, sumLum = 0, sumLum2 = 0;
  let warmPx = 0, coolPx = 0;
  // Para densidade visual: estima variância de luminosidade em janela 3x3
  let edgeSum = 0, edgeCount = 0;

  const reads = srcs.slice(0, 5).map(src => new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      const SZ = 80;
      const c = document.createElement('canvas');
      c.width = SZ; c.height = SZ;
      try {
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, SZ, SZ);
        const data = ctx.getImageData(0, 0, SZ, SZ).data;

        // Pré-calcula luminosidade por pixel pra estimar densidade visual
        const lums = new Float32Array(SZ*SZ);

        for(let y=0; y<SZ; y++){
          for(let x=0; x<SZ; x++){
            const i = (y*SZ + x) * 4;
            if(data[i+3] < 200){ lums[y*SZ+x] = -1; continue; }
            const r = data[i], g = data[i+1], b = data[i+2];

            // Bucketiza cor (5 bits por canal)
            const rb = r & 0xF8, gb = g & 0xF8, bb = b & 0xF8;
            const key = (rb<<16) | (gb<<8) | bb;
            buckets.set(key, (buckets.get(key)||0) + 1);

            const [h, s, l] = rgbToHsl(r, g, b);
            // só conta saturação/temperatura para cores não-neutras
            if(s > 0.1){
              sumSat += s;
              if(isWarmHue(h)) warmPx++; else coolPx++;
            }
            sumLum += l; sumLum2 += l*l;
            lums[y*SZ+x] = l;
            pxCount++;
          }
        }

        // Densidade visual via gradiente (diferença entre vizinhos)
        for(let y=1; y<SZ-1; y++){
          for(let x=1; x<SZ-1; x++){
            const ix = y*SZ+x;
            const c0 = lums[ix];
            if(c0 < 0) continue;
            const right = lums[ix+1], below = lums[ix+SZ];
            if(right < 0 || below < 0) continue;
            edgeSum += Math.abs(right-c0) + Math.abs(below-c0);
            edgeCount++;
          }
        }
      } catch(e){ /* tainted */ }
      res();
    };
    img.onerror = ()=>res();
    img.src = src;
  }));
  await Promise.all(reads);

  if(pxCount === 0){
    return { palette:[], warmth:0.5, contrast:0.5, saturation:0.5, density:0.5 };
  }

  // PALETA — top buckets com filtro de diversidade
  const sortedBuckets = [...buckets.entries()].sort((a,b)=>b[1]-a[1]);
  const palette = [];
  const used = [];
  for(const [key] of sortedBuckets){
    const r = (key>>16) & 0xFF, g = (key>>8) & 0xFF, b = key & 0xFF;
    const tooClose = used.some(u => {
      const dr=u[0]-r, dg=u[1]-g, db=u[2]-b;
      return Math.sqrt(dr*dr+dg*dg+db*db) < 55;
    });
    if(tooClose) continue;
    const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    palette.push(hex);
    used.push([r,g,b]);
    if(palette.length >= 6) break;
  }

  // MÉTRICAS NORMALIZADAS (0..1)
  const meanLum = sumLum / pxCount;
  const variance = (sumLum2/pxCount) - meanLum*meanLum;
  const contrast = Math.min(1, Math.sqrt(Math.max(0,variance)) * 3); // 0..1
  const saturation = Math.min(1, (sumSat / pxCount) * 2);            // 0..1
  const warmth = (warmPx + coolPx) > 0
    ? warmPx / (warmPx + coolPx)
    : 0.5;
  const density = edgeCount > 0
    ? Math.min(1, (edgeSum / edgeCount) * 4)
    : 0.5;

  return { palette, warmth, contrast, saturation, density };
}

/* Converte a análise visual em deltas no vetor de estilo */
function visualAnalysisToVector(analysis){
  const vec = makeVector();
  if(!analysis) return vec;
  // warmth: 0.5 = neutro, >0.5 = quente, <0.5 = frio
  adjustAxis(vec, 'quente', (analysis.warmth - 0.5) * 0.6);
  // saturation: alta saturação → vibrante
  adjustAxis(vec, 'vibrante', (analysis.saturation - 0.5) * 0.8);
  // contraste alto → mais sofisticado/formal
  adjustAxis(vec, 'formal', (analysis.contrast - 0.5) * 0.4);
  // densidade alta → ornamental e denso
  adjustAxis(vec, 'denso', (analysis.density - 0.5) * 0.7);
  adjustAxis(vec, 'ornamental', (analysis.density - 0.5) * 0.5);
  return vec;
}

/* Compatibilidade: alguns lugares ainda chamam extractPaletteFromImages */
async function extractPaletteFromImages(srcs, max){
  const a = await analyzeReferences(srcs);
  return a.palette.slice(0, max || 6);
}

/* Soma dois vetores com pesos */
function mergeVectors(va, vb, weightA, weightB){
  weightA = weightA || 1; weightB = weightB || 1;
  const out = {};
  STYLE_AXES.forEach(ax => {
    const a = (va && ax in va) ? va[ax] : 0.5;
    const b = (vb && ax in vb) ? vb[ax] : 0.5;
    out[ax] = (a * weightA + b * weightB) / (weightA + weightB);
  });
  return out;
}

/* Distância euclidiana entre dois vetores */
function vectorDistance(va, vb){
  let sum = 0;
  STYLE_AXES.forEach(ax => {
    const d = (va[ax]||0.5) - (vb[ax]||0.5);
    sum += d*d;
  });
  return Math.sqrt(sum);
}

/* Roles a partir da paleta extraída (claro=bg, escuro=primary, médio=accent) */
function paletteToRoles(palette){
  if(!palette || !palette.length) return null;
  const lum = hex => {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) / 255;
  };
  const sorted = [...palette].sort((a,b)=>lum(b)-lum(a));
  const bg      = sorted[0]                              || '#f4ede4';
  const primary = sorted[sorted.length-1]                || '#1a1a1a';
  const accent  = sorted[Math.floor(sorted.length/2)]    || '#b0883f';
  const secondary = sorted[Math.max(1, Math.floor(sorted.length*0.7))] || accent;
  const text = lum(primary) > 0.4 ? '#1a1a1a' : primary;
  return { bg, primary, accent, secondary, text };
}

/* Aplica cores nomeadas (do prompt) a uma paleta — substitui o accent
   se for diferente do bg, ou cria uma paleta derivada */
function applyColorsToPalette(roles, colors){
  if(!colors || !colors.length || !roles) return roles;
  // pega a primeira cor citada como accent (a mais "vívida" geralmente é citada)
  const out = { ...roles };
  // usa a primeira cor como accent
  out.accent = colors[0];
  // se tem segunda cor, vira secondary
  if(colors[1]) out.secondary = colors[1];
  return out;
}

/* ============================================================
   FACE CONFIG — quantas faces criar e como dividir o conteúdo
   - unified: uma peça única que cobre frente e verso (lado a lado)
   - frontOnly / backOnly: apenas um lado
   - dual: duas peças separadas
============================================================ */
function getFaceConfig(rotulo){
  const tipo = rotulo.tipo, cfg = rotulo.config;
  if(tipo === 'adesivo'){
    if(cfg === 'Único para frente e verso')
      return { kind:'unified', faces:[{id:'unico', label:'Peça única — Frente | Verso'}] };
    if(cfg === 'Só frente')
      return { kind:'front', faces:[{id:'frente', label:'Frente'}] };
    if(cfg === 'Só verso')
      return { kind:'back', faces:[{id:'verso', label:'Verso'}] };
    if(cfg === 'Frente e verso (2 peças)')
      return { kind:'dual', faces:[{id:'frente',label:'Frente'},{id:'verso',label:'Verso'}] };
  }
  if(tipo === 'sleeve'){
    return { kind:'unified', faces:[{id:'unico', label:'Manga 360° — Frente | Verso'}] };
  }
  if(tipo === 'serigrafia'){
    if(cfg === 'Só frente') return { kind:'front', faces:[{id:'frente', label:'Frente'}] };
    if(cfg === 'Só verso')  return { kind:'back',  faces:[{id:'verso',  label:'Verso'}]  };
    if(cfg === 'Frente e verso')
      return { kind:'dual', faces:[{id:'frente',label:'Frente'},{id:'verso',label:'Verso'}] };
  }
  if(tipo === 'inmold'){
    return { kind:'front', faces:[{id:'frente', label:'Área de impressão'}] };
  }
  return { kind:'dual', faces:[{id:'frente',label:'Frente'},{id:'verso',label:'Verso'}] };
}

/* ============================================================
   GERAÇÃO — agora baseada em template + face config
============================================================ */
const MM_PER_PT = 0.352777778;

function mkEl(type, props){
  return Object.assign({
    id:'e'+(state.editor.uid++),
    type, rot:0, opacity:100, visible:true, locked:false
  }, props);
}

/* escala de fonte conforme o tamanho do rótulo (sublinear) */
function fs(basePt, refMm, sizeMm){
  return basePt * Math.pow(Math.max(sizeMm,20) / refMm, 0.55);
}

function generateLabel(opts){
  opts = opts || {};
  const W = Math.max(30, state.rotulo.w || 70);
  const H = Math.max(30, state.rotulo.h || 90);

  const faceCfg = getFaceConfig(state.rotulo);

  // Bleed varia com o tamanho — rótulos grandes pedem sangria maior
  const bleed = W < 60 || H < 60 ? 3 : 5;
  const safe  = W < 60 || H < 60 ? 4 : 5;

  state.editor.label = { w:W, h:H, bleed, safe, bg:'#ffffff' };
  state.editor.uid = 1;
  state.editor.faceConfig = faceCfg;
  state.editor.face = faceCfg.faces[0].id;
  state.editor.sel = null;
  state.editor.docname = (state.frente.nome || state.verso.nome || 'Rótulo');

  // Inicializa array de cada face
  state.editor.faces = {};
  faceCfg.faces.forEach(f => state.editor.faces[f.id] = []);

  // Escolhe template (vem de opts.templateId, ou usa o primeiro)
  const tplId = opts.templateId || state.editor.templateId || TEMPLATES[0].id;
  const baseTpl = TEMPLATES.find(t=>t.id===tplId) || TEMPLATES[0];
  state.editor.templateId = baseTpl.id;

  // Paleta: opcional override (vem da paleta extraída ou customizada)
  const paletteOverride = opts.paletteOverride || null;
  state.editor.paletteOverride = paletteOverride;
  const palette = paletteOverride || baseTpl.palette;

  // Constrói um "template efetivo" com paleta possivelmente sobrescrita
  const tpl = {
    ...baseTpl,
    palette: palette,
  };

  state.editor.label.bg = palette.bg;

  // Helper para gerar conteúdo numa face
  const buildFace = (faceId, region, options) => {
    const arr = state.editor.faces[faceId];
    const ctx = {
      W, H, region, palette: tpl.palette, fonts: tpl.fonts,
      state, options,
      add: (type, props) => arr.push(mkEl(type, props)),
    };
    if(options.front) tpl.layoutFront(ctx);
    if(options.back)  tpl.layoutBack(ctx);
    if(options.foldAt != null){
      arr.push(mkEl('line', {
        name:'Linha de dobra (frente/verso)',
        x: options.foldAt, y: 0, w: 0.1, h: H,
        stroke:'#cccccc', sw:0.2, opacity:50, locked:true
      }));
    }
  };

  if(faceCfg.kind === 'unified'){
    const half = W / 2;
    buildFace('unico', {x:0, y:0, w:half, h:H}, {front:true, foldAt:half});
    buildFace('unico', {x:half, y:0, w:half, h:H}, {back:true});
  } else if(faceCfg.kind === 'front'){
    buildFace('frente', {x:0, y:0, w:W, h:H}, {front:true});
  } else if(faceCfg.kind === 'back'){
    buildFace('verso', {x:0, y:0, w:W, h:H}, {back:true});
  } else if(faceCfg.kind === 'dual'){
    buildFace('frente', {x:0, y:0, w:W, h:H}, {front:true});
    buildFace('verso',  {x:0, y:0, w:W, h:H}, {back:true});
  }

  edHistory = []; edHIndex = -1;
}

/* ============================================================
   TEMPLATES DE DESIGN — cada um define paleta, fontes e layouts
============================================================ */

/* === helpers comuns aos layouts === */
function getSelosList(state){
  const list = [];
  const s = state.selos;
  if(s.vegano) list.push({ seloKind:'vegano', name:'Selo Vegano' });
  if(s.materialReciclavel) list.push({ seloKind:'reciclavel', name:'Selo Material Reciclável' });
  if(s.jogueLixo) list.push({ seloKind:'jogueLixo', name:'Selo Jogue no Lixo' });
  if(s.euReciclo) list.push({ seloKind:'eureciclo', name:'Selo eureciclo' });
  if(s.crueltyFree) list.push({ seloKind:'crueltyFree', name:'Selo Cruelty Free' });
  if(s.naoTestado) list.push({ seloKind:'naoTestado', name:'Selo Não testado em animais' });
  if(s.tipoMaterial){
    // tipoMaterial vem como código ('1'..'7','PAP','ALU','GLS'); mapeia pro kind do SVG
    const mat = MATERIAIS_RECICLAGEM.find(m=>m.code===s.tipoMaterial);
    const kind = mat ? mat.kind : 'pet';
    const name = mat ? mat.name : s.tipoMaterial;
    list.push({ seloKind: kind, name:`Selo Material ${name}` });
  }
  if(s.validadeAbertura){
    list.push({ seloKind:'pao_'+s.validadeAbertura, name:`Selo PAO ${s.validadeAbertura}` });
  }
  return list;
}

/* === Desenha os selos no VERSO em grade no rodapé === */
function buildSelosBack(ctx){
  const { region:r, palette:p, state, add } = ctx;
  const selos = getSelosList(state);
  const outros = state.selos.outros || [];
  const total = selos.length + outros.length;
  if(total === 0) return;

  // Tamanho responsivo ao tamanho do rótulo
  const seloSize = Math.min(r.w * 0.11, r.h * 0.075, 14);
  const gap = seloSize * 0.25;
  const cols = Math.max(1, Math.min(total, Math.floor((r.w * 0.85) / (seloSize + gap))));
  const rows = Math.ceil(total / cols);

  const padX = r.w * 0.06;
  const totalGridW = cols * seloSize + (cols - 1) * gap;
  const startX = r.x + r.w - padX - totalGridW;  // alinha à direita
  // Posiciona acima do código de barras
  const codBarrasH = Math.min(r.h * 0.1, 16);
  const startY = r.y + r.h - r.h * 0.07 - codBarrasH - (rows * seloSize + (rows-1)*gap) - r.h * 0.02;

  let idx = 0;
  selos.forEach(s => {
    const col = idx % cols, row = Math.floor(idx / cols);
    add('selo', {
      name: s.name,
      x: startX + col * (seloSize + gap),
      y: startY + row * (seloSize + gap),
      w: seloSize, h: seloSize,
      seloKind: s.seloKind,
      color: p.text || '#1a1a1a',
    });
    idx++;
  });
  outros.forEach((src, i) => {
    const col = idx % cols, row = Math.floor(idx / cols);
    add('image', {
      name: `Selo próprio ${i+1}`,
      x: startX + col * (seloSize + gap),
      y: startY + row * (seloSize + gap),
      w: seloSize, h: seloSize, src,
    });
    idx++;
  });
}

/* === gera os parágrafos do verso (compartilhado pelos templates) === */
function buildBackParagraphs(ctx){
  const { region:r, palette:p, fonts:f, state, add, W:totalW } = ctx;
  const v = state.verso;
  const nome = (state.frente.nome || v.nome || 'Nome do Produto').toUpperCase();
  const padX = r.w * 0.06;
  const colW = r.w - padX * 2;
  let y = r.y + r.h * 0.05;
  const baseSize = fs(3.2, 60, Math.min(r.w, r.h)*1.3);
  const lh = 1.38;

  const para = (name, text, size, weight) => {
    if(!text || !text.trim()) return;
    const charPerLine = Math.max(20, colW / (size * MM_PER_PT * 0.5));
    const lines = Math.max(1, Math.ceil(text.length / charPerLine));
    const h = Math.max(size * MM_PER_PT * 1.6, lines * size * MM_PER_PT * lh);
    add('text', { name, x:r.x+padX, y, w:colW, h,
      text, font:f.body, size, weight:weight||500,
      italic:false, color:p.text, align:'left', lh, ls:0 });
    y += h + r.h * 0.012;
  };

  // título do verso (pequeno, só no template editorial)
  add('text', {
    name:'Título do verso', x:r.x+padX, y, w:colW, h: baseSize * MM_PER_PT * 1.4,
    text: nome, font: f.display, size: baseSize * 1.6, weight:700,
    italic:false, color:p.primary, align:'left', lh:1.1, ls:0.5
  });
  y += baseSize * MM_PER_PT * 2.2;
  add('line', {
    name:'Divisória do verso', x:r.x+padX, y, w:colW*0.18, h:0.1,
    stroke:p.accent, sw:0.4
  });
  y += r.h * 0.018;

  // §1 apresentação
  let p1 = '';
  if(v.introducao) p1 += v.introducao + ' ';
  if(v.modoUso) p1 += 'MODO DE USO: ' + v.modoUso + ' ';

/* ============================================================
   GERAR VARIAÇÕES — agora baseado em matching de vetor de estilo
============================================================ */
function buildBriefingVector(){
  // Vetor base: começa neutro
  let vec = makeVector();

  // 1. Adiciona contribuição do prompt
  const parsed = parsePrompt(state.ai.prompt);
  vec = mergeVectors(vec, parsed.vec, 1, 2);   // prompt tem peso 2

  // 2. Adiciona contribuição da análise visual
  if(state.ai.analysis){
    const visualVec = visualAnalysisToVector(state.ai.analysis);
    vec = mergeVectors(vec, visualVec, 2, 1);  // visual tem peso 1
  }

  return { vec, promptColors: parsed.colors };
}

function generateVariations(){
  const { vec: brief, promptColors } = buildBriefingVector();
  state.ai.briefingVector = brief;

  // 1. Ordena templates por menor distância ao vetor do briefing
  const ranked = TEMPLATES.map(t => ({
    tpl: t,
    distance: vectorDistance(brief, t.style || makeVector()),
  })).sort((a,b) => a.distance - b.distance);

  // 2. Monta paletas candidatas (em ordem de prioridade)
  const palettes = [];
  // Paleta do prompt + análise (se houver)
  const extractedRoles = state.ai.analysis
    ? paletteToRoles(state.ai.analysis.palette)
    : null;
  if(extractedRoles && promptColors.length){
    palettes.push({
      name:'Suas referências + cores do prompt',
      roles: applyColorsToPalette(extractedRoles, promptColors),
    });
  }
  if(extractedRoles){
    palettes.push({ name:'Das referências', roles: extractedRoles });
  }
  if(promptColors.length){
    // paleta sintética a partir das cores do prompt + template top
    const topTpl = ranked[0].tpl;
    const synthetic = applyColorsToPalette({ ...topTpl.palette }, promptColors);
    palettes.push({ name:'Cores do seu prompt', roles: synthetic });
  }
  // Paletas dos templates (sempre disponíveis como fallback)
  TEMPLATES.forEach(t => palettes.push({ name: t.name, roles: t.palette }));

  // 3. Monta 4 variações combinando rank de templates com paletas
  const variations = [];

  // Var 1: melhor template × melhor paleta
  variations.push(buildVariation(ranked[0].tpl, palettes[0]));
  // Var 2: melhor template × paleta original do template (segurança)
  variations.push(buildVariation(ranked[0].tpl, { name: ranked[0].tpl.name, roles: ranked[0].tpl.palette }));
  // Var 3: 2º template × paleta extraída se houver, senão sua paleta nativa
  const t2 = ranked[1] ? ranked[1].tpl : ranked[0].tpl;
  variations.push(buildVariation(t2, palettes[Math.min(1, palettes.length-1)]));
  // Var 4: 3º template × algo diferente
  const t3 = ranked[2] ? ranked[2].tpl : ranked[1] ? ranked[1].tpl : ranked[0].tpl;
  variations.push(buildVariation(t3, palettes[Math.min(2, palettes.length-1)]));

  state.ai.variations = variations;
  state.ai.chosenVariation = 0;
}

function buildVariation(tpl, paletteEntry){
  return {
    id: 'v' + Math.random().toString(36).slice(2,6),
    templateId: tpl.id,
    templateName: tpl.name,
    palette: paletteEntry.roles,
    paletteSource: paletteEntry.name,
  };
}

/* Aplica uma variação no editor */
function applyVariation(idx){
  const v = state.ai.variations[idx];
  if(!v) return;
  state.ai.chosenVariation = idx;
  generateLabel({ templateId: v.templateId, paletteOverride: v.palette });
}

  function close(){ overlay.remove(); }
  render();
  setTimeout(()=>{ const s = $('#sgSearch'); if(s) s.focus(); }, 50);
}

/* ============================================================
   FONT PICKER — modal com busca, categorias e prévia ao vivo
============================================================ */
function openFontPicker(currentFont, onPick){
  // Estado local do picker
  let selectedFont = currentFont;
  let searchQuery = '';
  let activeCategory = 'Todas';

  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  overlay.id = 'fontPickerModal';
  document.body.appendChild(overlay);

  function render(){
    const q = searchQuery.trim().toLowerCase();
    const cats = ['Todas', ...Object.keys(FONT_CATALOG)];

    // Filtra fontes pela categoria e pela busca
    let toShow = [];
    if(activeCategory === 'Todas'){
      // Featured primeiro, depois o resto
      if(!q){
        toShow = [
          { section:'⭐ Em destaque', fonts: FONTS_FEATURED },
          ...Object.entries(FONT_CATALOG).map(([cat, fonts])=>({
            section: cat, fonts: fonts.filter(f => !FONTS_FEATURED.includes(f))
          })),
        ];
      } else {
        const matched = FONTS.filter(f => f.toLowerCase().includes(q));
        toShow = [{ section:`${matched.length} resultados`, fonts: matched }];
      }
    } else {
      const fonts = FONT_CATALOG[activeCategory] || [];
      const filtered = q ? fonts.filter(f => f.toLowerCase().includes(q)) : fonts;
      toShow = [{ section: activeCategory, fonts: filtered }];
    }

    overlay.innerHTML = `<div class="modal" style="width:680px;max-width:94vw;max-height:84vh">
      <div class="modal-head">
        <h3>Escolher <span style="color:var(--accent)">fonte</span></h3>
        <button class="x" id="fpClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div style="padding:14px 24px 0;display:flex;flex-direction:column;gap:12px">
        <div style="position:relative">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="fpSearch" type="text" placeholder="Buscar fonte por nome..." value="${searchQuery.replace(/"/g,'&quot;')}" style="width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px 11px 40px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;transition:.14s">
        </div>
        <div class="fp-cats" style="display:flex;gap:6px;flex-wrap:wrap">
          ${cats.map(c=>`<button data-fp-cat="${c}" class="fp-cat ${activeCategory===c?'on':''}">${c}</button>`).join('')}
        </div>
      </div>
      <div class="modal-body" id="fpList" style="padding:6px 8px 12px">
        ${toShow.map(group => group.fonts.length === 0 ? '' : `
          <div class="fp-section">
            <div class="fp-section-h">${group.section}</div>
            <div class="fp-fonts">
              ${group.fonts.map(f=>`
                <button class="fp-font ${selectedFont===f?'sel':''}" data-fp-font="${f.replace(/"/g,'&quot;')}">
                  <div class="fp-font-name">${f}</div>
                  <div class="fp-font-prev" data-prev-for="${f.replace(/"/g,'&quot;')}" style="font-family:'${f}',sans-serif">Aa · Rótulo do Produto · 0123</div>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('')}
        ${toShow.every(g => g.fonts.length === 0) ? `<div style="padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px">Nenhuma fonte encontrada para "<b>${q}</b>"</div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="fpCancel">Cancelar</button>
        <button class="btn btn-primary" id="fpApply">Aplicar fonte</button>
      </div>
    </div>`;

    // Bindings
    overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
    $('#fpClose').onclick = close;
    $('#fpCancel').onclick = close;
    $('#fpApply').onclick = ()=>{ onPick(selectedFont); close(); };
    $('#fpSearch').oninput = e=>{
      searchQuery = e.target.value;
      render();
      $('#fpSearch').focus();
    };
    $$('[data-fp-cat]').forEach(b=>b.onclick = ()=>{
      activeCategory = b.dataset.fpCat;
      render();
    });
    $$('[data-fp-font]').forEach(b=>{
      b.onclick = ()=>{
        selectedFont = b.dataset.fpFont;
        $$('[data-fp-font]').forEach(o => o.classList.toggle('sel', o.dataset.fpFont === selectedFont));
      };
      b.ondblclick = ()=>{
        selectedFont = b.dataset.fpFont;
        onPick(selectedFont);
        close();
      };
    });

    // Lazy-load das fontes visíveis usando IntersectionObserver
    // (a prévia só vira a fonte real quando entra no viewport)
    const previews = overlay.querySelectorAll('[data-prev-for]');
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries)=>{
        entries.forEach(en => {
          if(en.isIntersecting){
            const fam = en.target.dataset.prevFor;
            ensureFontLoaded(fam);
            io.unobserve(en.target);
          }
        });
      }, { root: $('#fpList'), rootMargin:'200px' });
      previews.forEach(el => io.observe(el));
    } else {
      previews.forEach(el => ensureFontLoaded(el.dataset.prevFor));
    }
  }

  function close(){ overlay.remove(); }

  render();
  setTimeout(()=>{ const s = $('#fpSearch'); if(s) s.focus(); }, 50);
}

    // bindings
    const close = ()=>{ overlay.remove(); };

    $('#closeModal').onclick = close;
    $('#modalCancel').onclick = close;
    $('#modalPrompt').oninput = e=>{ modalPrompt = e.target.value; };
    $$('[data-mp]').forEach(b=>b.onclick = ()=>{
      const cur = modalPrompt.trim();
      modalPrompt = cur ? cur + ', ' + b.dataset.mp.toLowerCase() : b.dataset.mp;
      $('#modalPrompt').value = modalPrompt;
    });
    $('#modalRegen').onclick = ()=>{
      // regenera variações com o prompt do modal
      state.ai.prompt = modalPrompt;
      generateVariations();
      modalVariations = state.ai.variations;
      modalChosen = 0;
      $('#modalVarsGrid').innerHTML = renderModalVariations(modalVariations, modalChosen);
      bindModalVarCards();
      toast('Novas variações geradas');
    };
    $('#modalApply').onclick = ()=>{
      state.ai.prompt = modalPrompt;
      applyVariation(modalChosen);
      edPush();
      edSyncFaces();
      edRender();
      const v = state.ai.variations[modalChosen];
      toast('Aplicado: ' + v.templateName);
      close();
    };
    bindModalVarCards();

    function bindModalVarCards(){
      $$('#modalVarsGrid [data-mvar]').forEach(b=>b.onclick = ()=>{
        modalChosen = +b.dataset.mvar;
        $('#modalVarsGrid').innerHTML = renderModalVariations(modalVariations, modalChosen);
        bindModalVarCards();
      });
    }

  buildModal();
}

function renderModalVariations(vars, chosen){
  return vars.map((v,i)=>{
    const swatches = ['bg','primary','accent','secondary'].map(k=>
      `<div class="vp" style="background:${v.palette[k]}"></div>`).join('');
    return `<button class="vcard ${i===chosen?'sel':''}" data-mvar="${i}">
      <div class="vchk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div class="vthumb" style="background:${v.palette.bg}">${renderMiniLabel(v)}</div>
      <div class="vname">${v.templateName}</div>
      <div class="vdesc">Paleta: ${v.paletteSource}</div>
      <div class="vpalette">${swatches}</div>
    </button>`;
  }).join('');
}

/* ============================================================
   ETAPA 9 — EDITOR (render é só "ativar")

RENDER.editor = ()=>{};

/* ============================================================
   RENDER.material — Etapa 11: seleção de material de impressão
   Navegação em 3 níveis: family → variant → subvariant (quando aplicável)
============================================================ */
RENDER.material = () => {
  const M = state.material;
  let html = `<div class="screen">
    <div class="eyebrow">Passo 11 · Produção</div>
    <h1 class="scr">Em qual <span class="hl">material</span> seu rótulo será impresso?</h1>
    <p class="scr-sub">Cada material tem visual, durabilidade e custos diferentes. A escolha define também quais acabamentos especiais ficam disponíveis na próxima etapa.</p>`;

  // Trail/breadcrumb: mostra o caminho escolhido até agora
  if(M.family){
    html += `<div class="mat-trail">`;
    html += `<button class="mat-trail-item active" data-trail-reset>${MATERIAIS_TREE[M.family].name}</button>`;
    if(M.variant){
      html += `<span class="mat-trail-sep">›</span>`;
      const v = MATERIAIS_TREE[M.family].variants[M.variant];
      html += `<button class="mat-trail-item active" data-trail-variant-reset>${v.name}</button>`;
      if(M.subvariant){
        html += `<span class="mat-trail-sep">›</span>`;
        const sv = v.subvariants[M.subvariant];
        html += `<span class="mat-trail-item current">${sv.name}</span>`;
      }
    }
    html += `</div>`;
  }

  // Nível 1: famílias de materiais
  if(!M.family){
    html += `<div class="mat-grid">`;
    Object.entries(MATERIAIS_TREE).forEach(([key, fam])=>{
      html += `<button class="mat-card" data-family="${key}">
        <div class="mat-swatch mat-swatch-${key}">${getMatPreviewSVG(key)}</div>
        <div class="mat-card-body">
          <div class="mat-name">${fam.name}</div>
          <div class="mat-desc">${fam.desc}</div>
        </div>
        <div class="mat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </button>`;
    });
    html += `</div>`;
  }
  // Nível 2: variantes da família
  else if(!M.variant || (MATERIAIS_TREE[M.family].variants[M.variant] && !MATERIAIS_TREE[M.family].variants[M.variant].subvariants)){
    const fam = MATERIAIS_TREE[M.family];
    html += `<div class="mat-section">
      <div class="mat-section-h">${fam.name} — escolha a variante</div>
      <div class="mat-grid">`;
    Object.entries(fam.variants).forEach(([vkey, v])=>{
      const sel = M.variant === vkey;
      const hasSubs = !!v.subvariants;
      html += `<button class="mat-card ${sel?'sel':''}" data-variant="${vkey}">
        <div class="mat-swatch mat-swatch-${M.family}-${vkey}">${getMatPreviewSVG(M.family, vkey)}</div>
        <div class="mat-card-body">
          <div class="mat-name">${v.name}</div>
          <div class="mat-desc">${v.desc}</div>
        </div>
        ${hasSubs ? `<div class="mat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>`
        : `<div class="mat-check">${sel?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>`}
      </button>`;
    });
    html += `</div></div>`;
  }
  // Nível 3: subvariantes
  else {
    const fam = MATERIAIS_TREE[M.family];
    const v = fam.variants[M.variant];
    html += `<div class="mat-section">
      <div class="mat-section-h">${fam.name} ${v.name} — escolha o acabamento de superfície</div>
      <div class="mat-grid">`;
    Object.entries(v.subvariants).forEach(([svkey, sv])=>{
      const sel = M.subvariant === svkey;
      html += `<button class="mat-card ${sel?'sel':''}" data-subvariant="${svkey}">
        <div class="mat-swatch mat-swatch-${M.family}-${M.variant}-${svkey}">${getMatPreviewSVG(M.family, M.variant, svkey)}</div>
        <div class="mat-card-body">
          <div class="mat-name">${sv.name}</div>
          <div class="mat-desc">${sv.desc}</div>
        </div>
        <div class="mat-check">${sel?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
      </button>`;
    });
    html += `</div></div>`;
  }

  // Botões de navegação inferiores
  html += `<div class="step-nav">
    <button class="btn btn-ghost" id="matBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Voltar ao editor</button>
    <button class="btn btn-primary" id="matNext" ${isMaterialComplete(M)?'':'disabled'}>
      Avançar — Acabamentos
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>`;

  html += `</div>`;
  $('#screen').innerHTML = html;

  // Bindings
  $$('[data-family]').forEach(b=>b.onclick = ()=>{
    state.material = { family:b.dataset.family, variant:null, subvariant:null };
    RENDER.material();
  });
  $$('[data-variant]').forEach(b=>b.onclick = ()=>{
    state.material.variant = b.dataset.variant;
    state.material.subvariant = null;
    // Se a variante não tem subvariantes, já avança automaticamente
    RENDER.material();
  });
  $$('[data-subvariant]').forEach(b=>b.onclick = ()=>{
    state.material.subvariant = b.dataset.subvariant;
    RENDER.material();
  });
  // Breadcrumb: cliques pra voltar
  const tr = $('[data-trail-reset]');
  if(tr) tr.onclick = ()=>{ state.material = {family:null,variant:null,subvariant:null}; RENDER.material(); };
  const trv = $('[data-trail-variant-reset]');
  if(trv) trv.onclick = ()=>{ state.material.variant = null; state.material.subvariant = null; RENDER.material(); };

  $('#matBack').onclick = ()=>{ go(9); };  // volta pro editor
  const next = $('#matNext');
  if(next) next.onclick = ()=>{ if(!isMaterialComplete(state.material)) return; go(11); };
};

/* SVG inline pra preview de cada material (visual placeholder) */
function getMatPreviewSVG(family, variant, subvariant){
  // Para nível 1 (só family), usa um swatch genérico
  if(!variant){
    if(family === 'bopp') return '<rect width="100" height="100" fill="#f0eee9"/><rect x="15" y="20" width="70" height="60" rx="4" fill="#fff" stroke="#cbc4ba" stroke-width="1.5"/><text x="50" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#8b8478" font-family="ui-sans-serif">BOPP</text>';
    if(family === 'vinil') return '<rect width="100" height="100" fill="#f4f1ec"/><rect x="15" y="20" width="70" height="60" rx="6" fill="#fff" stroke="#b8aea0" stroke-width="2.2"/><text x="50" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#8b8478" font-family="ui-sans-serif">VINIL</text>';
    if(family === 'couche') return '<rect width="100" height="100" fill="#fcfaf6"/><rect x="15" y="20" width="70" height="60" fill="#fff" stroke="#d8d2c5" stroke-width="1"/><text x="50" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#8b8478" font-family="ui-sans-serif">COUCHÉ</text>';
    if(family === 'gofrado') return '<defs><pattern id="gof" patternUnits="userSpaceOnUse" width="6" height="6"><circle cx="3" cy="3" r="0.8" fill="#c8c0b0"/></pattern></defs><rect width="100" height="100" fill="#f4ede0"/><rect x="15" y="20" width="70" height="60" fill="url(#gof)" stroke="#b8aea0" stroke-width="1"/><text x="50" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#7a7060" font-family="ui-sans-serif">GOFRADO</text>';
  }

  // Nível 2: variantes
  if(family === 'bopp'){
    if(variant === 'branco') return '<rect width="100" height="100" fill="#fafaf7"/><rect x="20" y="25" width="60" height="50" rx="3" fill="#fff" stroke="#dcd6cc" stroke-width="1.5"/>';
    if(variant === 'metalizado' && !subvariant) return '<defs><linearGradient id="mtl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8e8eb"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#b8b8be"/></linearGradient></defs><rect width="100" height="100" fill="#ede9e1"/><rect x="20" y="25" width="60" height="50" rx="3" fill="url(#mtl)" stroke="#a0a0a8" stroke-width="1.5"/>';
